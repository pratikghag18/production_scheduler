name: CI

on:
  push:
    # BOTH long-lived branches. `main` is protected and only ever receives merges
    # from a pull request; `Development` is where work lands, and listing it here
    # is what gives that work a check before the PR is opened.
    #
    # Keep this list in step with the branches that actually exist. It read
    # `[main]` for the repository's whole first 43 commits while the default
    # branch was called `Development`, so the only live trigger was
    # `pull_request` and not one check ever ran. A trigger naming a branch
    # nobody pushes is indistinguishable from having no CI at all.
    branches: [main, Development]
  pull_request:

# Dummy Supabase values for every step EXCEPT the e2e run. They are load-bearing
# for the unit suite, typecheck and lint: `src/lib/supabase.ts` reads `@/env` at
# module top level and `src/env.ts` THROWS on a missing VITE_SUPABASE_URL, and 17
# unit files import it without mocking -- with these unset, `npm run test` goes red
# before the e2e step ever runs (the gitignored `.env.local` masks this locally).
# The e2e step does NOT want the dummies: scripts/ci-e2e.sh stands up a real
# Supabase stack and exports the VITE_SUPABASE_* the stack prints (e2e/env.ts reads
# process.env first), so the browser suite signs in for real instead of skipping
# (stage S34). Real values for a deploy job, when one is added, arrive as secrets.
env:
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_ANON_KEY: dummy-anon-key

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The plan of record must validate before anything else: an entry that names a
      # stage, requirement or pin that does not exist is a broken record of the work.
      - run: npm run plan -- --check

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      # Stand up a real Supabase stack (Docker is present on ubuntu runners), load
      # migrations + seed.sql + dev_demo.sql, point the app at it, and run every
      # browser case -- so the signed-in specs run instead of skipping and a skip
      # stops counting as a pass. All of that lives in one script a developer can
      # also run locally. See scripts/ci-e2e.sh (stage S34).
      - run: bash scripts/ci-e2e.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
