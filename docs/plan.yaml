- id: 49
  date: 2026-09-04
  title: The board is told which parts it may offer, instead of deducing it from a list it cannot see all of (DEF-0005)
  commits:
  - 808a52d
  numbers:
    app_tests: 1786
    app_test_files: 60
    tsc: 0
    eslint: 0
  confirmed: true
  summary: >-
    The tester came back with the mirror image of DEF-0002, and it is the more serious of the two. A
    supervisor granted one line opened her own board, saw four parts on her legend, was offered ONE, and the
    server accepted all four. DEF-0002 was a control SHOWN for something the server refuses — loud, because
    every attempt ends in a 409. This was a control HIDDEN for something the server permits, which says
    nothing at all: three quarters of her work simply could not be scheduled and no screen explained why.
    THE CAUSE WAS NOT THE RULE BUT ITS MATERIAL, and that distinction is the lesson. `product_sites` is
    RLS-filtered on read and reading is downward from a grant, so a part made at the PLANT above her had its
    only place row dropped before it reached her client. Every version of the client predicate then answered
    "offered nowhere" — correctly, for the list it was handed. Two states arrived as the same empty array:
    "assigned to no plant" and "every place is above your grant". Nothing downstream could tell them apart,
    because the information was gone before it got there. It was invisible to every role that could report
    it, too: an admin's grant covers everything their own board can show.
    So the client stopped deriving the answer and started being told it. Migration 0042 adds
    `app_offered_product_nodes` — the set form of `app_product_offered_at`, SECURITY DEFINER for the same
    reason that one is — and `board_window` carries `offered_node_ids` per product: the nodes in THIS window
    where a run would be ACCEPTED. The picker is membership and nothing else; no path logic is left on the
    client that can disagree with the server. The other option, widening `product_sites_select`, was not
    taken: it changes a read policy and hands a line supervisor the existence of a plant she has no grant on,
    where answering the question changes no policy and discloses strictly less. The DEFINER helper therefore
    filters its own output, and X4–X6 are the cases that would catch that slipping — a root above her grant,
    a sibling department, and the other tenant, which uses the same paths.
    ⚠️ THE TESTER'S SECOND FINDING IS THE ONE WORTH KEEPING. DEF-0002's fix argued in `scope.ts` that
    "nothing legitimately offerable disappears" — sound about the change it made, and then generalised to
    the picker as a whole, which it never examined. Case XP9 was GREEN while asserting the opposite of what
    the server answers, and my review of that lane accepted both the argument and the case. They are gone
    with the path logic they described. F-080's rule, "ask what narrowed the map", now carries its limit: it
    can only be applied by someone who knows what narrowed it, and here both had happened, one layer apart.
    When a question turns out to need information the client was never given, move the question rather than
    sharpening the guess.
    DEF-0002's pin was promoted in the same commit, as CLAUDE.md allows now that it is verified: its claim
    survives as XP4 beside the new predicate, and its `pin` field points at the new home. Checked in the
    browser as Ana — four parts offered where one was — and the admin's board still lists exactly its own
    plant's four, so DEF-0002 has not come back. Suite 1786 in 60 files (the promoted pin's file is gone, its
    claim is not); the SQL sweep reports 0 failed across all 30 files, 65 contributing 8; `npm run db:types`
    was regenerated, so tsc 0 here is conclusive rather than inconclusive.
