- id: S12
  track: core
  num: 12
  title: The drag on the levels list — now grabbable, and there *was* a bug behind it
  status: done
  owner: agent
  refs:
  - §19.56
  - P1-6e
  delivers:
  - R-228
  - R-230
  what: >-
    **You said it still isn't there. It was — and my own roadmap agreed with you, which is the actual
    story.** Whole-row dragging on the level list was built in stage 08: pointer capture, a movement threshold,
    an insertion caret, the lot. The queue entry for it was never ticked off, so for five days two of
    us believed it was unwritten.


    Why it felt absent, measured rather than guessed: rendering one level row and testing every pixel
    against the code's own rule, **21 pixels out of 526 across the middle of the row would start a drag**
    — three seven-pixel gaps between the controls — and nothing marked them. No grip, and the cursor never
    changed; the only place it did change was over the buttons, which are the parts you *can't* drag.


    **Now:** a grip at the left of every row (the same one the node tree uses), a hand cursor on the row,
    and a soft tint when you hover it. **21 pixels becomes 53**, and the hand cursor now appears on *exactly*
    the pixels that work and nowhere else — the text box says "text", the buttons say "click", the rest
    says "grab". Touch gets a path for the first time too, as a side effect of matching the tree.


    **You told me to look for a bug behind the affordance once it was grabbable. There was one.** With
    no way to drive your running app, I did the next honest thing: rendered the real row with the real
    stylesheet, drove the real code over it at 672 pointer positions, and fed every result through the
    real reordering function. Two answers came back, and they were opposite. **The maths was right — 528
    out of 528 drops landed exactly where the green line promised.** And **231 of those 528 — 44% — drew
    a green line that promised a move and then did nothing at all.**


    It's the same defect I fixed on the node tree two weeks ago, still alive on this screen because the
    two lists keep their own copies of the rule — and nobody could find it here, because nobody could
    grab a row. Dragging a level, the gap directly above it and the gap directly below it are both *where
    it already is*. Those two now behave properly: the whole of the row above means "put it above", the
    whole of the row below means "put it below", and the row you're dragging shows no line at all. **Re-measured
    after: 396 live pixels, none dead, no disagreements.**
  state: >-
    Done. 25 new checks, 11 deliberate breakages, 10 caught and 1 proved harmless with a check written
    to pin *why* it's harmless. Two more things came out of just looking at it: the hover tint was landing
    one pixel from the green line and made it read as a border instead of an insertion point, and **the
    grip has been effectively invisible on both admin screens since it shipped** — measured at 1.29 to
    1 against its background, where 3 to 1 is the floor. Both fixed. **Still not proved:** nothing has
    driven your running app. If you connect Claude to your browser, that gap closes completely and I can
    drive it myself.
- id: S13
  track: core
  num: 13
  title: One drag surface, two screens — “shouldn’t this be done by default?”
  status: done
  owner: agent
  refs:
  - §19.58
  - D100
  delivers:
  - R-D100
  - R-230
  what: >-
    **Your question, and it was the right one.** You looked at the node tree and the levels list side
    by side and said the drag styling didn’t match, that it should match by default, and that we were
    reinventing rather than reusing. All three were true, and the third is the one that matters.


    Measured, the two screens disagreed in **five** places at once: two different hover colours; real
    padding on one and a fake shadow imitating padding on the other; two copies of the same fourteen-line
    grip block; two copies of the same fade; and the grip itself in a different place on each. **Every
    line in both files was correct. The defect was that there were two of them.** And one of the two hover
    colours was the exact three-unit grey I’d already measured as rendering *nothing* — so “make them
    match” could just as easily have meant copying an invisible tint onto the second screen.


    **So the fix isn’t matching them. It’s making it impossible to mismatch.** Every drag colour is now
    a named value in one place, and the shared rules — grip, hand cursor, hover tint, row padding, the
    fade, the text-selection lock — live in one file that both screens pull from. What’s left in each
    screen is only what genuinely differs: the tree’s insertion line indents to the depth of the thing
    you’re dragging, the levels list’s spans the row. That’s geometry, not taste.


    **And the grip moved, because you were right about that too** — sitting next to the up/down arrows
    put two ways of moving the same row side by side, so the pair read as one control with a broken half.
    It now sits second from the right, immediately before the row’s own ×, exactly where the tree puts
    its grip before the ⋮. A left-edge grip is the more common convention in the abstract; matching the
    screen next to it wins, because you look at these two together.
  state: >-
    Done. **12 new checks and 10 deliberate breakages, all 10 caught** — the checks fail the build if
    either screen ever grows its own copy of a shared rule again, or reaches past the named colours to
    a raw one. That is the part that makes “by default” true rather than aspirational. Draggable pixels
    across the middle of a level row: **21 before, 61 now.**
- id: S14
  track: core
  num: 14
  title: The shared lists get an owner — and it turns out to gate everything else
  status: done
  owner: agent
  refs:
  - §19.59
  - §19.60
  - D101
  - D102
  - migration 0023
  delivers:
  - R-D101
  - R-D102
  - R-211
  - R-240
  - R-241
  - R-242
  - R-243
  what: >-
    Operators, products, skills and shift patterns become a site's own, the way the tree and the level
    names now are. Entries with no owner stay company-wide.


    **I moved this up your list, and here is the reason it earned the jump.** You asked whether I could
    build Shifts, Operators, Products and Import in parallel. Checking that properly turned up something
    neither of us had looked at: **today a site admin can edit no operator, no product and no shift pattern
    — and the admin page lets them in anyway.** Those rules still ask the old company-wide question. So
    switching any of those four screens on before this change ships a screen that opens for a site admin
    and quietly throws away every edit they make. That is the same lesson as stage 11, pointing the other
    way: stage 11 was *anything you hide, the server must refuse*; this is *anything you show, the server
    must allow* — and this one is worse, because it looks like it works.


    **And your two answers land here.** *“The shift pattern will be per-site, we can have defaults but
    I’d rather the site admin set them up for their site, same thing for colours.”* So shift patterns
    join the same change — which also settles a contradiction I’d found between two of my own documents,
    one saying company-wide and the other saying per-site, with nothing to break the tie. “We can have
    defaults” is already how this change works: an entry with nobody’s name on it stays company-wide,
    so you seed a standard pattern once and each site adds its own alongside.


    **Colours the same way, and it finally fixes the positional accident:** a product gets a colour of
    its own instead of inheriting whichever slot it happens to sit in, stored as a *name* from the palette
    rather than a raw hex so a theme change stays one edit, with a sensible default so an untouched product
    still looks right. Whoever owns the product sets its colour — the site admin for their own, the company
    admin for the shared ones. **What I deliberately did not build:** a per-site override of a shared
    product’s colour. That would make one product two different colours on two boards, which is the exact
    confusion a colour exists to prevent.


    **Built, and four things were wrong with it before it shipped — not one of them found by reading it.**
    A permission trigger was answering the question itself instead of letting the rule answer, so a refusal
    came back saying “that plant doesn’t exist” about a plant that plainly does. The colour palette shipped
    with eight colours against a stylesheet that defines four, so half of them would have rendered as
    no colour at all — found by a test *my own notes had argued was unnecessary*. A product’s colour could
    be blanked. **And the one that matters most: I handed the finished file to a separate agent whose
    only instruction was “break this”, and it found a hole I had read past three times** — the colour
    picker could be asked about *another company’s* products. Its suggested fix was also wrong, and measuring
    that is what produced the right one. That third pass is now a standing part of how anything I build
    myself gets checked.


    **One deliberate limit, stated so it isn’t mistaken for an oversight:** nothing existing was handed
    to a site. Every operator, product, skill and shift pattern that exists today stays company-wide,
    because deciding they belong to Plant 1 is a decision you never made. The practical consequence is
    that **after you run the CLI, nothing looks different** — a site admin still sees the same shared
    lists, because that is all there is. Two sample rows owned by Plant 2 in the demo data would make
    it visible, and that is a small next step rather than part of this change.
  state: >-
    Done. One database change, not four, carrying both of your decisions. **315 database checks pass**
    (271 before), **28 deliberate breakages, 24 caught** — the other four proved harmless, each with the
    rule it depends on now pinned by its own check. **The app test count does not move: still 713.** Nothing
    on screen reads the new columns yet, so a different number would mean something else broke. Costs
    you a CLI run and a commit.
- id: S15
  track: core
  num: 15
  title: >-
    Moving something to a different rung — and the two things the database had been saying wrong
  status: done
  owner: agent
  refs:
  - §19.61
  - P1-5k
  - migration 0024
  delivers:
  - R-244
  - R-245
  what: >-
    The buttons for stage 03's second half: when a plant was set up with something at the wrong rung,
    this moves it up or down and brings everything under it along. Drag moves a thing sideways; this moves
    it up and down.


    **The menu says what it will make the thing, not what the operation is called.** Not “Promote” — **“Make
    this a Department”**, using the words your own structure uses for its rungs. And when it can’t be
    done, **the entry stays visible and greyed with the reason underneath** rather than quietly vanishing:
    “Move to…” can shorten a list because there is a list, but this is one thing to click, and hiding
    it leaves someone with a tree they can’t fix and no idea why.


    **And building the screen found two things the database had been getting wrong since stage 03 — both
    invisible to every test that existed.** The reason they were invisible is worth more than the bugs:
    *every one of those 33 tests asked what a legal move does, and not one asked what a refusal looks
    like.*


    **First:** moving something into a place that already has something of that name came back as a *raw
    database error* with no explanation attached at all — the screen would have shown a line of Postgres
    jargon. **And I had measured that exact failure a day before writing stage 03, written down what to
    do about it, and then not done it.** The note was in the design document the whole time. Nothing noticed,
    because nothing was looking at refusals.


    **Second, and worse:** the most important refusal this feature makes — *“you can’t move this, there
    are three shifts booked on it”* — was packaged in a shape the app can’t read. It would have reached
    you as **“Something went wrong. Please try again.”** That is the whole point of the feature arriving
    as a shrug.
  state: >-
    Done, plus a small database change to fix both. **332 database checks** (315 before), **11 deliberate
    breakages, 7 caught**, the other four harmless with the rule each depends on pinned by its own check.
    On the screen side, **36 new checks and 15 deliberate breakages, all 15 caught. Your test count moves:
    713 → 751.**
- id: S16
  track: core
  num: 16
  title: Shifts, Operators, Products — three screens, and the answer to your parallel question
  status: done
  owner: agent
  refs:
  - §19.57
  - §19.62
  - §19.63
  delivers:
  - R-239
  - R-246
  - R-247
  what: >-
    **You asked whether I could spin up agents to work on these at once. I measured it instead of guessing:
    four read-only survey agents, one per screen, running simultaneously, each told to read the database
    files as the authority and to hand back an exhaustive list of every file it would have to touch.**
    All four came back, they agree with each other, and the answer is a qualified yes.


    **Four agents building four screens at once would collide**, and not on anything interesting. Every
    one of them flips the same switch in the same navigation file and adds a block to the same list. Every
    one of them adds its stylesheet to an audit list — *and to a second hard-coded copy of that same list
    in a test*, which fails the build if it's missed, and which one of my own briefs already missed once.
    Every one adds a line to the same exports file, appends to the same two planning documents, and needs
    the same database change from stage 14.


    **But every single one of those collisions is in a file I can edit once, up front.** So the shape
    is: stage 14 lands, you run the CLI, and then **one small commit that pre-seats the shared files**
    — all four panels created and wired in, all four stylesheets created and listed in both places, all
    four data modules created and exported. After that each agent only ever creates its *own* files, and
    the lanes really do run at once.


    **The pre-seat commit is done — that is what this handoff is.** Every one of those shared files is
    now edited, once. Four empty panels exist, four empty data modules exist, and both audit lists know
    about them. **Nothing changed on screen:** the four rail buttons are still greyed with their “soon”
    labels, because a section only turns on when its own panel says it is ready.


    **And that last part is the bit worth keeping.** The switch that turns a screen on used to live in
    the shell, next to the other five; it now lives *inside each panel*. So a screen cannot be switched
    on unless there is a panel behind it — not because someone remembers, but because the switch is part
    of the thing it switches on. The same move as the drag colours in stage 13: make the rule structural
    rather than remembered.
  state: >-
    **Done, and the three lanes have now run — see the next stage. Each runs in three waves: a read-only
    survey, then the build, then a review by a different agent that did not write it** — that third wave
    is what caught the cross-tenant hole in stage 14, so it is not optional. Import is *not* one of the
    parallel lanes; see the next stage for why. **6 new checks, 6 deliberate breakages, all 6 caught.**
- id: S17
  track: core
  num: 17
  title: The three screens — built at once, then deliberately attacked
  status: done
  owner: agent
  refs:
  - §19.64
  delivers:
  - R-248
  - R-249
  - R-253
  what: >-
    **Shifts, Operators and Products were built in parallel, exactly as stage 16 said they could be, and
    the pre-seat held:** 21 files changed, every one of them a file its own lane owned, and not a single
    shared file touched twice. That is the parallel question answered in practice rather than on paper.


    **What each screen does.** *Shift patterns* is clock times and nothing else — a shift that runs past
    midnight shows its end marked “+1d”, and a break at quarter past midnight is inside a night shift
    rather than twenty hours outside it. *Operators* leads with your own question: **where can this person
    work, and why not.** A list of places, a tick or a cross against each, and the reason beside the cross
    — “missing Welding”, “Forklift expires 3 Sep”. Tickets are underneath, because they are the *mechanism*,
    not the vocabulary. Change the date you are asking about and the answer changes, which is the thing
    a stored yes/no could never do. *Products* shows each product in its own colour — the one the database
    picked for it, not its position in a list — and puts **deactivate before delete**, because anything
    that has ever been scheduled can never be truly deleted at all.


    **Then I had them attacked, and this is the part worth reading.** The three lanes came back green:
    the type checker clean, the linter clean, all three test suites passing, and **twenty deliberate breakages
    of my own, all twenty caught**. I had rendered the screens and looked at the picture. By every instrument
    I own, this was finished work.


    **Eleven defects were still in it.** I sent one reviewer per screen — agents that had not written
    a line of it — and told each one to hunt a specific *kind* of mistake rather than to “review the code”.
    Every finding was then reproduced here before anything was changed, and two of their claims did not
    survive that step. The four that mattered are in the list below.


    **The lesson I am taking from it is uncomfortable and worth saying plainly: my own deliberate breakages
    only test what I had already thought of.** All twenty of mine were caught. Nine of theirs went straight
    through a green suite. A breakage list written by the person who wrote the code is measured against
    that person’s own picture of it — the same picture that left the holes. The review wave cost less
    than any of the three builds.
  state: >-
    **Done and handed over. 10 new checks — 1030 to 1040 — and nine deliberate breakages that a green
    suite had ignored: eight now caught, one measured genuinely harmless and written down as such rather
    than left as a number. No database change.** ⚠️ **Five things I found are deliberately NOT fixed**,
    because each needs your call rather than a patch — the first one is at the top of the “what turned
    up” list and it is the largest single thing outstanding in the project.
- id: S18
  track: core
  num: 18
  title: You opened the screens, and found six things in ten minutes
  status: done
  owner: agent
