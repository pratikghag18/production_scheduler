    pass.** Both were an audit of mine doing exactly its job — a new stylesheet under the admin folder
    that I had not added to the list that audit walks. Fixed, and then measured on your machine rather
    than predicted: the list is complete, removing the new entry makes the audit name it again so the
    entry is not decorative, and the new stylesheet has no unscaled sizes in it. All of it has since landed
    — read scoping (migrations 0026/0027, sessions 15–17), ownership at any level (0028, session 16),
    the board's picker and crew list (0027/0030, session 17), the naming rule (0031, session 18) and the
    starter set (0035, session 19, 1 Sept) — so the stage closed in session 19.
- id: S22
  track: core
