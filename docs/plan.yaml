  title: No run carries a status either, and the overlap rule loses its exception (R-324)
  commits:
  - b11f7aa
  numbers:
    app_tests: 1788
    app_test_files: 60
    tsc: 0
    eslint: 0
  confirmed: true
  summary: >-
    The other half, taken deliberately rather than smuggled in with the first: *"Let's go ahead and remove
    it from runs as well."* `runs.status` was write-once 'planned' — 0029 had already established that
    nothing ever advanced a run and used the clock instead — and runs have always been hard-deleted, so
    'cancelled' was a state no run could reach and the exception that read it could never fire.
    ⭐ THE EXCEPTION IS WHY THIS WAS ITS OWN PIECE OF WORK. `runs_no_overlap_on_node` is not a function that
    can be edited in place; it is a constraint on the table, and its definition carried
    `where (status <> 'cancelled')`. Removing the column means DROPPING the rule that stops two jobs sharing
    a cell and adding it back — and a replacement written slightly wrong raises nothing at all, it just
    starts accepting overlaps. So `67_no_run_status_test.sql` asks the rule rather than reading it: an
    overlap is refused, the same window on ANOTHER cell is still accepted, and an ADJACENT window on the
    same cell is still accepted. Without those last two, a constraint that refused everything would pass.
    ⚠️ AND ONE OF THEM CAUGHT MY OWN TEST BEFORE IT COULD PASS FOR THE WRONG REASON. The adjacency case
    first hung a run off the end of a SEEDED one and was refused — because the seed puts consecutive shifts
    on the same cell, so "just after this ends" was already occupied. The constraint was right and the case
    was wrong. It builds its own pair now, in a window nothing else touches.
    Case 7c in `10_constraints_test.sql` asserted "an overlapping run with status=cancelled is accepted" and
    was right until today; it is INVERTED rather than deleted, because the contract changing is the
    deliverable and a quietly missing case would hide it. Two other SQL files listed the column in their run
    inserts and no longer do. On the client, `boardIndex` now filters nothing at all — both status lines are
    gone, replaced by positive cases asserting every run and every assignment reaches a map.
    Suite 1788 in 60 files, tsc 0 with `db:types` regenerated, every SQL file green. Driven in the browser:
    the board draws its runs and a run's pop-up still opens, edits and deletes.
  shipped: []
- id: 53
  date: 2026-09-04
  title: A deleted assignment is deleted (R-323)
  commits:
  - 33280cb
  numbers:
    app_tests: 1788
    app_test_files: 60
    tsc: 0
    eslint: 0
  confirmed: true
  summary: >-
    The maintainer followed R-322 to its conclusion: *"why do we need this in runs or assignments? We
    removed the option to assign status, what am I missing here?"* — and, offered gone versus
    kept-and-hidden, *"I want it gone"*. Two facts turned that from a preference into an obvious call. The
    same table already deleted BOTH ways — `delete_run` has always removed a run's assignments outright while
    the assignment's own Delete marked them cancelled — and migration 0029 had already recorded that the
    status vocabulary cannot be believed, using the clock instead. The column was being routed around rather
    than used, and the audit trigger has held actor and whole row for every insert, update and delete since
    0007, so nothing about "who removed this" depended on it.
    ⭐ THE COLUMN WAS THE EASY PART. Four functions filtered on it, and those filters live inside the two
    rules that stop a person or a cell being committed twice. Each is re-created in 0043 from its LAST
    definition with only the assignment clause removed, and `66_no_assignment_status_test.sql` does not test
    the removal at all: X2 and X3 test that the capacity guard and the overlap rule still REFUSE, which is
    what a careless removal switches off silently. A suite that only checked "the column is gone" would pass
    on a database that had stopped protecting anybody.
    ⚠️ THE MOST DANGEROUS LINE IS THE ONE THAT DELETES THE CANCELLED ROWS FIRST, and it was nearly missed. A
    cancelled assignment is invisible only because the board filters it and the guard skips it — drop the
    column with those rows in place and the very thing making them invisible is what disappears, so every
    cancelled assignment comes back to life at once, on a board, counting against an operator's hours. One
    such row existed in the maintainer's database. It is deleted, with the audit log holding it.
    Two things fell out. `60_api_test.sql` holds a SECOND copy of `operator_peak_load`'s query, restored
    after it mutates the real one — the only place in the suite that failed the drop, and CLAUDE.md's "a
    column list that appears twice is a bug with a delay on it" with the delay expired. And the boardIndex
    case that asserted cancelled assignments are filtered was HALVED rather than deleted: the run half still
    holds, and a new case asserts positively that every assignment reaches a map, because "nothing was
    filtered" is invisible if you only remove an assertion.
    `runs.status` is deliberately left and queued: removing it means dropping and re-adding the overlap
    exclusion constraint, which is a correctness invariant nobody asked about. Suite 1788 in 60 files, tsc 0
    with `db:types` regenerated, every SQL file green including the new one at 6 of 6. Driven in the browser:
    Delete removed the block with no error, and the table went from 39 rows to 38 rather than 39 with one
    hidden.
