    tsc: 0
    eslint: 0
  confirmed: true
  summary: >-
    The maintainer asked whether the tester's three defects could be fixed in parallel. They could: no two of
    them touched the same file, which is the only thing that makes three lanes safe. Each lane got its own
    named files, the tester's pin as read-only (it goes green BY the fix or not at all), docs off limits, and
    a named subset of the suite instead of the full runner.
    DEF-0003 was the smallest and the most instructive. The parser demanded `owner_node_id` from a refusal
    the product guards stopped sending it in since migration 0034, so every product refusal since fell to
    "Something went wrong. Please try again." — an instruction to repeat an action that can never succeed.
    Three keys are required now and the owner is lifted when present. The lesson is not the line: the SQL
    side already KNEW, `55_ownership_scope_test.sql` case N3 pins the product keys as error,id,kind,node_id
    and explains why. Only the TypeScript was behind, and tsc cannot see a runtime string test.
    DEF-0002 was the offering predicate failing open on a place it could not resolve — right for a map
    narrowed by permission, wrong for the board's, which is narrowed by the plant the reader picked. Twelve
    parts offered on Plant A's board, eight of them guaranteed 409s. The same bug was fixed for operators one
    function over in R-310; the product half was left behind. Turning a fail-open into a fail-closed is the
    kind of change that has to be argued rather than typed, and the argument (nothing offerable can
    disappear, because a place covering a cell in the selected root is either inside it or an unreadable
    ancestor) is written in the file.
    Reviewing that lane found the half its fix did not reach, by driving it rather than reading it: the
    popover survives a change of place. Open it on Plant A, switch the picker to Plant B, and it stayed up
    with its dropdown grown from four parts to all thirteen — BoardPage cannot resolve a Plant A node in
    Plant B's map and fell back to the whole catalogue. A root change now closes any popover, and the two
    fallbacks return nothing rather than everything. That is the value of the second pair of eyes the
    parallel-lane rule asks for, and it took three clicks in a browser to find.
    DEF-0004 was presentation: a line that makes a part with none of its cells timed drew the same bare dash
    as a line that does not make the part, so the row with the most to report said nothing. It reads "0 of 2
    measured" now, in the count line's own words, and the three states are three accessible names where
    before two of them were one dash against another. The gap behind it mattered more than the glyph:
    CycleTimesPanel was the only admin panel with no render test, which is exactly how a green model case
