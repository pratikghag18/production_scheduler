- id: M1
  track: matrix
  num: 1
  title: The pure core
  status: done
  owner: agent
  refs:
  - §19.86
  delivers:
  - R-297
  - R-298
  - R-300
  what: >-
    **A dependency-free module a supervisor never sees, and the whole feature rests on it.** Everything
    load-bearing decided from plain values — no React, no Supabase — the way `scope.ts` and `operators.ts`
    already are, so it is unit-tested under vitest with no browser. It computes: the **nested column header**
    (each training's owner walked up to the common root, grouped into bands with the right colspans and
    rowspans, own-trainings of a node bucketed as “… area-wide” beside its children); the **cell state**
    for an operator×training from the holding and its expiry against a “today” and a window; **applicability
    / N/A** via `isAtOrBelow`; **scope filtering** of rows and columns; and **team grouping** of the rows.


    **What is in this stage**

    - **Cell-state derivation** with the expiry boundaries pinned (expired when `expires_at < today`;
    expiring inside the window; a null expiry never expires).

    - **The nested-header builder**, general to any depth, with the ordering rule (own-before-children,
    ancestors merged) and the rowspan for shallow buckets.

    - **Scope + applicability** on ltree paths, mirroring the server so no shown tick can be a lie.

    - **A full vitest suite** — the expiry edges, the header shapes (single plant, company root, an area
    scope pulled up to its plant by a plant-wide training), N/A, ordering, grouping.
