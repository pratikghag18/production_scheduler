  - R-279
  what: >-
    **Your correction, and it was the right one.** I had asked whether a person’s area should just filter
    the list, and argued that their trainings already answer where they can work. You said no — and the
    distinction is real: *training* answers “are they capable”, *area* answers “are they cleared to be
    there at all”. Both have to be true, and only one of them is about competence.


    **You chose the strong version:** the database refuses an assignment outside someone’s area, and a
    supervisor can override it while recording a reason. **That machinery already exists** — every assignment
    row has carried an override flag, a reason and who made it since the first week — so this is using
    a pattern rather than inventing one.


    **★★ HALF OF THIS WAS ALREADY LIVE BEFORE THE STAGE STARTED, AND IT ARRIVED SIDEWAYS.** When you replaced
    the model in stage 21 — *“no product or operator can be assigned where it does not belong”* — that
    **is** this rule, and the database has been enforcing it since that change went in. A person belongs
    to a place; an assignment outside it is refused outright. Nobody built it as stage 20; it fell out
    of the ownership rule.


    **★★ But what had shipped was STRICTER than what you asked for, and that was the part left to build.**
    You asked for a refusal *a supervisor can override while recording a reason*. There was no override
    at all. Measured on a real database before this stage was built: **the company admin** — the one account
    no permission check refuses — asking with the override flag set and a reason attached, on a cell in
    their own company:


    The override flag that already existed governed the *training* check and nothing else, so it did not
    reach this rule at all. That is the same trap the note below warns about, arriving from the other
    direction: I was watching for the weak permission accidentally granting the strong one, and what actually
    happened is that the strong one shipped with no permission attached to it whatsoever.


    **★ Your call, and it is what got built: anyone who can schedule there.** A supervisor with edit rights
    on that cell can place someone outside their area, recording a reason — so the area rule is a strong
    warning rather than a wall, and the record carries who waved it through and what they said.


    **★★ The door is a COLUMN on the row, not an argument to a form, and that is the whole design.** The
    refusal is a database rule that fires on *any* write — including a plain edit that passes through
    no form at all. An override plumbed through the assignment form would have worked on one screen and
    refused on the next, which is exactly the failure the note above warned about. Putting the flag and
    the reason *on the assignment itself* means every way of writing one carries it: the form, dragging
    a run to another cell, and splitting coverage — three layers, and splitting coverage is the middle
    one that quietly drops things.


    **★ Two flags and two reasons, deliberately.** Waving through “no Welding ticket” and waving through
    “not cleared for this plant” are now separate decisions with separate reasons, because one is about
    competence and the other is about permission, and one supervisor saying yes to the first must not
    silently say yes to the second.


    **★ The flag also cannot be used to claim credit for nothing.** If the assignment did not actually
    need an override, the database turns the flag back off and clears the reason before storing it. Otherwise
    “this was overridden” would come to mean “somebody sent a flag”, and the record would fill with waved-through
    placements that never needed waving through.


    **★★ And dragging a run now names the people, instead of failing on whichever row it hit first.**
    A run moved to another cell may carry a crew of six, two of whom are outside their area. The old behaviour
    was to stop at the first one and report that single row; the move now checks the whole crew up front
    and tells you *every* name that would need waving through, so you decide once rather than six times.


    **★ The PRODUCT half deliberately has no door, and that is load-bearing.** A person is cleared or
    not cleared — a human judgement a supervisor can make. A product belonging somewhere is a fact about
    the structure, and stage 21’s delete-that-keeps-the-past depends on it being absolute: the written
    proof that deleting a part can be done safely by an ordinary admin rests on the product rule having
    no way through. So one half got an override and the other half was left alone on purpose. On screen
    they are treated oppositely too: **a product outside its scope is removed from the picker** — offering
    something that will certainly be refused is the same defect as a button named after less than it does
    — while **a person outside theirs stays in the list with a note**, because you are allowed to place
    them.
  state: >-
    **Done, applied and green.** One database change carrying the flag, the reason, all three write paths
    and the up-front crew check. **Twenty-three new checks; 468 database checks pass here, up from 445.**
    Broken fifteen ways on purpose: thirteen caught, and the other two written down — one is the harmless
    control, the other a branch that a rule one line later makes unreachable, kept because it costs nothing.
    **Twice during that run the instrument itself was wrong, and the second time is the one worth reading**
    — see the findings below. On screen: the override block on the assignment form mirrors the training
    override you already know, and the crew names come through on a refused drag. **⚠ One screen has not
    caught up** — the Operators admin panel still answers “where can this person work” on trainings alone
    and ignores their area entirely. You found it; it is the first finding below and the next thing to
    build. That screen caught up in session 18 (§19.77): three states, and the list cut at the person's
    own plant.
  measure_note: >-
    as the COMPANY ADMIN, override := true, reason := 'supervisor says it is fine' --> REFUSED PT409 "That
    person does not belong to this part of the structure."
- id: S21
  track: core
  num: 21
  title: “No member from one plant should see info for other plants”
  status: done
  owner: agent
  refs:
