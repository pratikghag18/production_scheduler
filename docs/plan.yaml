  what: >-
    Bulk-load a hierarchy, operators and products from a spreadsheet.


    **What is left in this stage**

    - **Trainings are ready** — they carry the id a spreadsheet matches on, so a second upload updates
    instead of duplicating.

    - **Places can be matched now.** The original blocker: a row in your spreadsheet could not be tied
    to a place in the hierarchy, so the tree could not be imported at all. Fixed — places carry an id
    and a note of where they came from.

    - **Parts have their rule.** They had the column and nothing stopping two of them claiming the same
    id, so a second upload would have quietly built a duplicate set.

    - **Settled, and built: a part is company-wide, made in a LIST of plants (Sep 1).** The decision that
    was yours is answered — the number is the company’s, and the plants it is made in are a list (migration
    0034). So two plants can both hold `SKU-9` because it is one part made in both, and an import that
    names overlapping part numbers now updates the shared part rather than being refused.

    - **People are matched company-wide; parts belong to a list of plants.** Left as noted, but an importer
    has to know it: one code is one company-wide part offered in several plants, and one person.

    - **The upload screen — DONE for products and operators (Sep 1).** Choose a file, preview what it
    will do to every row (add, update, or error), fix what is wrong, then apply; a second upload of the
    same file updates rather than duplicating. Plus a downloadable template and an in-app legend. The
    wizard was refactored generic — products and operators share one `ImportWizard` with an entity-tab
    picker.

    - **Training import — DONE (Sep 1).** The wizard now has four tabs: Products, People, Trainings (bulk-add
    training types per plant) and Certifications (people’s records, matched by employee reference and
    training name on the person’s branch, with sign-off and expiry). All four run in the browser.

    - **Tree CSV import — dropped.** The starter library gives a new plant its structure by copying and
    the visual tree editor beats a parents-and-children CSV, so it is not worth building outside a rare
    ERP bulk-load.
  state: >-
    **Its premise doesn't exist — and today's survey found a second one missing.** Nodes have no external
    reference to match an imported row against, which we knew. *Products have the column but no uniqueness
    rule on it*, so the products half can't match either. And a third thing worth knowing before anyone
    writes this: since stage 09, creating a new top-level site quietly makes it its own *copy* of a structure
    — which is correct on a screen where you create one site at a time, and wrong for an import of twelve,
    where it would silently manufacture twelve structures. Needs its own database change first, and the
    written description of that function is out of date on top of it. Both premises were fixed since (external
    ids on places and a uniqueness rule on parts), and all four importers — products, people, trainings
    and certifications — shipped on 1 Sept (session 19) with the tree importer dropped by agreement, so
    the stage closed by session 20.
- id: S24
  track: core
  num: 24
  title: 'The front door: getting people into the system at all'
  status: now
  owner: agent
  refs:
  - P1-6b
  - P1-6c
  - P1-6d
  delivers: []
  what: >-
    **Parked on your call — capability first. Recorded here so it can't go missing again, because it already
    did once.** You asked where somebody searches to add a person, and whether they'd have to be in the
    database already. They would, and nothing in the app puts them there: no sign-up, no invitation, no
    password reset, and *no sign-in screen at all*. The only way anyone logs in today is a developer-only
    switcher that never ships in a real build.


    It splits in two, and the halves are very different sizes. **A real sign-in screen is small** — one
    browser call, no server piece, probably a single sitting. **Invitations are the bigger half** and
    need a piece of privileged server-side code this project doesn't have yet.


    **What is left in this stage**

    - **A sign-in screen — DONE (Sep 1).** Email and password, a gate that remembers where you were going,
    and sign out.

    - **The dead end where somebody signs in but belongs to no company — DONE (Sep 1).** It now shows
    a plain no-access page instead of nothing useful.

    - **Invitations (P1-6c).** The big half: it needs a privileged server-side Edge Function, and this
    project has none at all yet.

    - **Password reset and change.** Same shape as the sign-in screen.


    **What is left is the bigger half: invitations (P1-6c), which needs the project's first server-side
    Edge Function, plus password reset and change (P1-6d). The sign-in half is done.**
  state: >-
    **★ DONE (Sep 1) — the small half is in.** There is a real sign-in screen now: email and password,
    a route gate that sends you to sign in and then on to where you were headed, a way to sign out, and
    a plain dead-end for somebody who gets in but belongs to no company. The developer-only switcher is
    no longer the only door. Sign-in (P1-6b) and the no-access dead end shipped in session 19 (1 Sept);
    invitations (P1-6c) and password reset (P1-6d) are not built, so the stage stays open.
