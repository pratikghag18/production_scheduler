- id: R-324
  title: No run carries a status either — and the overlap rule stops making an exception for one
  source:
  - the maintainer, 4 Sept (in session, after the assignments half landed and the run half was explained and queued, "Let's go ahead and remove it from runs as well")
  stated_by: maintainer
  claim: >-
    `runs.status` is gone. It was write-once 'planned' — nothing in the product has ever advanced a run to
    active, done or cancelled, which migration 0029 recorded as fact and worked around by using the clock —
    and runs have always been hard-deleted, so 'cancelled' was a state no run could reach.
    ⚠️ THE REASON THIS WAS SPLIT OFF FROM R-323 IS `runs_no_overlap_on_node`, the rule that stops two runs
    sharing a cell and a window. It is not a function that can be edited: it is a constraint on the table,
    and its definition carries `where (status <> 'cancelled')`. Removing the column means DROPPING that
    constraint and adding it back without the exception — the protection is off in between, and a
    replacement written even slightly wrong is silently weaker rather than loudly broken. So the new
    constraint is asserted from the outside afterwards: an overlapping run must be REFUSED, on the same cell,
    including the case that used to be the exception.
    ⚠️ AND THE EXCEPTION IS NOW A REAL REFUSAL. `10_constraints_test.sql` case 7c asserted that "an
    overlapping run with status=cancelled is accepted". That was true and is now impossible to express;
    the case is inverted rather than deleted, because the change of contract is the point.
    Any cancelled run is deleted before the constraint is rebuilt, with its assignments first — not
    housekeeping but a precondition, since an unconditional exclusion constraint cannot be created at all
    over rows that violate it, and a cancelled run overlapping a live one is exactly the shape the old
    exception permitted.
  verified_by:
