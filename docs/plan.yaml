    are not: `runs` and `assignments` both fire `write_audit_log`, and the table already holds inserts,
    updates and deletes for both, with `before`/`after` and an actor. What is missing is anything that
    READS it — no API function, no screen, no export; `audit_log` appears in `src/` only as a generated
    type. So this is a client piece, not a migration, and it is bigger than the old line implied.
- text: Phase 1 — E2E test pass (Playwright) + load sanity
  why: Unchecked Phase 1 item.
- text: A way to CHOOSE warn or block for eligibility (the enforcement itself is built)
  why: >-
    ⚠️ MEASURED, AND THE ITEM AS WRITTEN WAS WRONG — the maintainer said so first: *"one has to give an
    override decision right now, there is a warning as well and doesn't let you assign a person without
    a reason, what am I missing?"* Nothing. Enforcement shipped on BOTH sides. `assignments` carries
    `eligibility_override` and `override_reason`; `CreatePopover` computes `blocked` and `needsOverride`
    from `eligibilityPolicy` and disables Create until a reason is typed; and the server reads
    `orgs.settings->>'eligibility_policy'` in `create_assignment`, `move_run`, `apply_split_coverage`
    and their 0043/0044 successors, with a CHECK constraint pinning it to ('warn','block') since 0001.
    WHAT IS ACTUALLY MISSING is the switch. `orgs.settings` has exactly ONE write RPC —
    `set_org_date_format` (0037/0038) — so `eligibility_policy` and `capacity_cap` cannot be changed
    from the app at all: every org is on 'warn' unless somebody edits jsonb by hand. So this is a
    Settings control plus one write RPC, in the shape 0037 already established, NOT the Phase 2 board
    work the old line described.
- text: Phase 2 — Certification expiry checked against a run's dates on the board
  why: The matrix surfaces expiry; checking it against assignment dates is the remaining half.
- text: Phase 2 — Copy Week with dry-run conflict preview
  why: Unchecked Phase 2 item.
