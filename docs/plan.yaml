- id: 40
  date: 2026-09-03
  title: A node chooses whether it adds its children up (R-319)
  commits:
  - cef0c6b
  numbers:
    app_tests: 1746
    app_test_files: 56
    tsc: 0
    eslint: 0
  confirmed: true
  summary: >-
    The maintainer, looking at the roll-up: "if two lines are working the same products but are parallel jobs,
    then adding them to the higher hierarchy does not make sense and is wrong. Some lines could be in
    continuation of one another and some could be parallel to one another." This is a sharper objection than
    the caveat R-317 already carried. That caveat said a sum is not an output RATE but is still labour content
    per unit. True only where a unit passes through every child: two cells in a line are sequential stations,
    so a unit really does cost both, but two lines under an area are alternative routes and no unit ever costs
    both — so for parallel lines the sum is not labour content either, it describes nothing. Offered three
    designs, the maintainer cut it short: "I want to be able to choose to add or not to add." So it is one
    nullable boolean per node and no more. NULL means nobody has said and resolves on read rather than the
    column guessing, which keeps a chosen "false" distinguishable from an unset one and leaves nodes created
    later working without touching create_node. The default was mine to pick since they left it: add up only
    where a node's own children are the schedulable level, asked of the actual children rather than of level
    depths, which is right for a line over its cells and wrong nowhere it is not one click from fixing. A row
    that adds up totals every measured place below it rather than composing its children's values, so one
    level declining cannot blank a row two levels above. A row that does not says "not added" with the counts
    behind it. No new RLS: the existing nodes_update policy already covers every column, which C11-C13 are
    what actually establish rather than assume. Display only throughout — no target reads it, so a wrong
    setting misleads a reader and corrupts nothing, which is why a plain toggle is proportionate and a routing
    model is not. Driven in the browser: lines defaulted to adding and showed 30/45/15 min, the areas above
    read "not added", ticking Plant A totalled 1.5 h over six cells. Suite 1746 in 56 files, up from 1738.
  shipped: []
