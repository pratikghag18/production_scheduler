  what: >-
    **Five of the six are not mistakes in what the code computes. They are things the screen never offered**
    — and that is a class of defect no test can find, because a test can only check things somebody thought
    to build. This is worth saying plainly: the three screens had passed a type check, a linter, three
    test suites, twenty deliberate breakages of my own, eleven found by reviewers, and a picture I had
    studied. Then you clicked on them.


    **Breaks were a sentence; they are a table now.** Name, clock, length, actions — four columns you
    can read *down*, which is what the two real questions need (“which is the long one”, “do these two
    collide”). My first attempt at it stretched the name column across the whole panel and put “Lunch”
    six hundred pixels from “10:00–10:30”, which is a flex row wearing a table’s clothes. The render caught
    that; nothing else would have.


    **A break can be edited now — and the write to do it already existed.** This is the uncomfortable
    one. `updateBreak` had been built, tested, given its own error handling, and *called from nowhere
    on screen*. So the only way to move a break by five minutes was to delete it and retype it, which
    also silently lost its name. A destructive action offered for a non-destructive intent. There is a
    cheap check for this shape and I have now been bitten by it twice: **look for something the code exports
    that nothing imports.**


    **A pattern row now looks like it opens.** It was a button with no border and no background — pixel-identical
    to the plain text beside it — with the entire shift list of that pattern hidden behind it. You found
    it by clicking on the off-chance; a new user would not have. It has a caret that turns, a name that
    underlines when you point at it, and a “show shifts” hint.


    **And the colour is yours to set.** The original decision was that a product’s colour is chosen for
    it and never changes — and the reasoning was about the *system* not changing its mind behind your
    back, which is still right. It said nothing about you deciding. The swatch is now a button that opens
    the palette; creating a product still picks a colour automatically, and nothing re-picks on a rename.
    The hint under the form used to end “and never changes afterwards”, which had to change in the same
    breath — a hint describing the old behaviour is worse than none, because it tells someone the control
    they are looking at does not exist.
  state: >-
    **Done and handed over. 6 new checks — 1040 to 1046 — and a mutation found one more hole while I was
    writing them:** two different problems on the same shift were being treated as the same problem, so
    a shift that already had a naming complaint could be given an illegal time and save silently. **No
    database change.**
- id: S19
  track: core
  num: 19
  title: “Belongs to” becomes a place in the hierarchy, not just a plant
  status: done
  owner: agent
  refs:
