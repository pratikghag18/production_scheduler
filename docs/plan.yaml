    file: supabase/tests/67_no_run_status_test.sql
    cases: "X1 the column is gone and the constraint is no longer partial; X2 an overlapping run on the same cell is REFUSED; X3 the case that used to be ALLOWED (the cancelled-run exemption) is refused now, which is the whole change; X4 the same window on another cell is still accepted and X5 an adjacent window on the same cell is still accepted, because a rule that refused everything would pass X2 and X3 and be worse than the one it replaced; X6 create_run and move_run work with no status to write, and neither payload carries the key"
