  - R-258
  what: >-
    **Your question:** a product, a ticket or a shift pattern might belong to one line rather than a whole
    plant — how do we say so, and have everything under that line inherit it? Today the picker offers
    only “company-wide” or a plant name.


    **I drew the two things that could mean and you picked the larger one:** where something belongs decides
    *where it is offered*, not just who may edit it. A product on Line 1 appears on Line 1’s cells and
    nowhere else; company-wide stays the everywhere fallback. It is the same “nearest one above you wins”
    rule shift patterns already use.


    **People were deliberately left out here — and you overturned that the same day, correctly. See stage
    20.** What I had argued at the time: Where someone can work is already answered by their tickets against
    what a cell requires. A second rule that could disagree with that would mean two systems refusing
    for different reasons with nothing on screen able to reconcile them. So a person’s “belongs to” filters
    *the roster you see* and nothing else.


    **It is cheaper than it sounds.** Nothing has to be migrated — everything currently set to a plant
    or to company-wide stays valid, so this only widens what the picker will accept. The permission half
    already works for any level. The board can do the filtering itself from data it already loads. What
    genuinely has to be built is the picker becoming a tree, and every list that offers a choice learning
    to ask “which cell am I on?” first.


    **Built, and the “Belongs to” box is the whole tree now** — company-wide, then every plant, department,
    line and cell, indented so you can see where you are. Products, trainings and shift patterns all use
    it. **Colours are yours too:** the four presets are still one click, and there is a picker and a hex
    field beside them for the case where four is not enough. A colour is still chosen automatically when
    you create a product, and still never moves on its own.


    **The database change is a widening, which sounds safe and is the risky kind.** Everything that was
    legal before is still legal, so every existing test passes no matter how far the change went — which
    is why more than half the new tests check what must *still be refused*: another company’s node, a
    supervisor who is not an admin, and five near-miss colour spellings. Deliberately breaking one of
    those found a real hole: an unanchored check would have accepted `teal #1baf7a` as a colour, which
    is exactly what a paste from a design tool looks like.


    **And one thing got fixed on the way that had been blocking you without either of us seeing it.**
    The Products screen decided whether you could edit a row by asking which *structures* you administer
    — which is not the question the database asks. A site whose structure is shared with another site
    dropped out of that list entirely, so its admin saw every button greyed out while the server would
    have accepted every one of their changes. It now lets you try and shows the server’s answer, which
    since the error work two stages back is a plain sentence rather than a shrug.


    **And then you told me a fourth time, and this time I rendered the screen instead of reading the code.**
    Here is what was on it. Every product row offered three buttons — **Deactivate**, **Rename**, **Delete**
    — and the “Belongs to” column was plain text. **There was no button called Edit anywhere on the row.**
    The picker you asked for, the code box and the name box were all behind the button marked *Rename*,
    and “rename” promises that only the name changes. You read that row, correctly concluded a product
    could not be moved, and told me so. Press it and everything works — the dropdown is there, the whole
    tree is in it, and Save sends the new place. **The feature was finished three sessions ago. The door
    was labelled wrong.** The same button on shift patterns had the same problem. Both now say **Edit**,
    and hovering says what is behind them: change its code, its name, or where it belongs. Operators already
    said Edit — which is exactly why you stopped reporting the operator half and kept reporting this one.


    **Why every test was green while you were blocked, which is worth more than the fix.** The check I
    wrote last session to make this impossible reads three files of database code and asks whether the
    word for “where it belongs” still appears near the word for “change it”. It would have passed with
    the entire Products screen deleted from the project. Underneath that: **nothing in this project had
    ever tested a screen** — 24 test files, all of them testing the machinery behind the screens, none
    of them looking at one. There is now a first one, and the thing that makes it different is that it
    hunts for buttons by the words printed on them, the way you do. I broke the code seven ways on purpose;
    it caught all seven, and correctly ignored a harmless eighth.


    **One more thing the picture showed.** None of the five demo products is attached to a plant, and
    a company-wide product can only be changed by a company admin — so if you sign in as one of the two
    site administrators, **every row on that screen is greyed out**, four times over. Nothing is wrong
    with the code there; the demo data just makes a working screen look dead. That was already on the
    list as a small chore and it has been moved up.
  state: >-
    **Done — you can edit a product.** The database half was in and tested last session (24 new database
    checks, 332 to 356; 15 deliberate breakages of the database change and 11 of the screen code, none
    uncaught). The screen half is now genuinely reachable, and it has the project’s first test that looks
    at a screen: 7 new checks, 7 deliberate breakages, all caught. **Run the suite and check it says 25
    files, not 24** — if it still says 24, the new test did not run and the number means nothing.
- id: S20
  track: core
  num: 20
  title: “Certain people can only work in certain areas”
  status: done
  owner: agent
  refs:
