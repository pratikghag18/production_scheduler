- id: F-084
  title: Nine migrations the database has but its own ledger does not
  tag: A command nobody should run
  status: open
  found_by: agent
  refs:
  - R-326
  story: >-
    `npx supabase migration list --local` reports 0037 through 0045 with an empty `remote` column: the
    local database's `supabase_migrations` ledger does not record them as applied. The schema plainly
    HAS them -- 0044 dropped `runs.status`, which is exactly why the demo world stopped building
    (DEF-0006). They were applied by hand rather than through the CLI, and the ledger was never told.
    ⛔ THE HAZARD IS A COMMAND THAT LOOKS ROUTINE. `supabase migration up` reads that ledger and would
    re-run all nine, in order, against a database that already has them. Most are `CREATE OR REPLACE`
    and would merely be redundant. 0043 and 0044 are not: they carry `ALTER TABLE ... DROP COLUMN` and,
    worse, `DELETE FROM assignments WHERE run_id IN (SELECT id FROM runs WHERE status <> 'planned')` --
    a statement written to run ONCE, before the column went, and now referring to a column that does not
    exist. The run would fail partway through, and what it did before failing depends on where it got to.
    ⚠️ WHAT WAS DONE ABOUT IT HERE: nothing, deliberately, beyond not running the command. 0045 was
    applied by hand the way its neighbours were, which keeps the machine consistent with itself and does
    not pretend to fix the ledger. Reconciling it properly means deciding whether to mark the nine as
    applied (`supabase migration repair`) or to rebuild the database from the migration set, and that is
    a maintainer's call about their own working database, not something to slip into a session about
    certifications.
    ⭐ WHY IT IS FILED RATHER THAN MENTIONED. This is the third time in three sessions that a fact
    about THIS MACHINE rather than about the code has cost something: the demo fixture on no runner, the
    phantom table no migration created, and now a ledger that disagrees with the schema. None of them
    could go red in CI, because none of them exist in a fresh checkout.
- id: F-083
  title: The comment said it was a known edge, and it was the ordinary case
  tag: A limitation nobody re-read
  status: fixed
  found_by: agent
  refs:
  - R-258
  violates:
  - R-258
  story: >-
    The Trainings list named every row control after the owner's LEAF name -- "Retire Forklift at Line
    A" -- and `trainings.ts` recorded the consequence in its own header, in as many words: *"it is the
    LEAF name, so two 'Line 1's in different plants still collide here."* Filed as a known edge and read
    past ever since.
    ⭐ IT IS NOT AN EDGE, AND THE SCHEMA SAYS SO. `nodes` carries `unique (org_id, parent_id, name)`:
    SIBLING names are unique and names across the tree are not. So two plants each naming their first
    line "Line A" is legal and unremarkable -- it is what people do -- and `skills_owner_name_unique`
    then lets each of those lines own a "Forklift". Both rows are permanent, and with one row's edit
    open four separate controls read identically, including two "Retire Forklift at Line A" buttons of
    which one retires the wrong plant's course. A screen-reader user has no way to tell them apart.
    ⚠️ WHAT MAKES THIS WORTH A CARD IS THE SHAPE, NOT THE FIX. The defect was not hidden; it was
    documented, in the file that caused it, in the words of somebody who had understood it. What was
    wrong was the label "edge" -- a judgement about how OFTEN it happens, attached to a fact about what
    the database permits, and never revisited once the product grew a second plant. A comment that
    excuses a limitation is a place to check, not a place to stop reading.
    Fixed by naming rows with the owner's full path where the leaf is shared and the leaf alone where it
    is not -- sibling uniqueness per parent is exactly what makes a whole path unique. The old comment's
    other half, that a three-level name read out on every button is a cure worse than the disease, was
    right and is why the short form survives wherever it is unambiguous.
- id: F-082
  title: The fixture the browser sees was the one file no runner ever built
  tag: A guard that sits below the place things break
  status: fixed
  found_by: tester
  refs:
  - R-D112
  - R-324
  violates:
  - R-D112
  story: >-
    `dev_demo.sql` builds the world the running app shows - three plants, a line-scoped supervisor, the
    only fixture that can demonstrate rules the seed's single plant cannot. Migration 0044 dropped
    `runs.status` and this file went on writing it, so it died at its runs insert on the next reset.
    Everything the app needs to LOOK fine was already in by then: the sign-ins worked, the plants were
    there, and the board was simply empty - which reads as a product with no data rather than as a
    fixture that stopped half way.
    ⭐ THE FILE HAD TWELVE ASSERTIONS AND ONE OF THEM WAS THIS BUG. Its section 8 opens by saying, in
    as many words, that a demo which half-ran is worse than one that failed, and then checks that there
    are 36 runs. It never ran. Assertions at the FOOT of a file cannot catch a file that dies four
    hundred lines above them, and that is a general shape rather than an accident of this fixture: a
    guard placed after the work only fires on the runs that did not need it. So the fix was not more
    assertions but moving the check to the APPLY, where an error at any line is the failure.
    ⛔ AND THE REASON IT WAS ON NO RUNNER TURNED OUT TO BE A GOOD ONE, WHICH IS WHY IT LASTED. The
    file opens by DELETING org 1's seeded content, and about eighteen cases across eight files need
    that content intact; the SQL suite runs every numbered file against one shared scratch database
    without rebuilding between them. So it could not simply be given a number - anything sorted after
    it would have read the wrong world, quietly. The answer was a second database of its own
    (`run-sql-test.sh --demo`), not a place in the existing queue.
- id: F-081
  title: The CI step that was red was two steps before the one we fixed
  tag: A test that never ran
  status: fixed
  found_by: maintainer
  refs:
  - R-321
  story: >-
    The maintainer, on a workflow that had never once been green: *"why are my workflows failing on github?
    I thought we fixed them."* DEF-0001 was a real fix and CI never reached it. `format:check` runs two
    steps before `test` and five before `e2e`, and it had been failing on thirteen committed files — so
    every run since the trigger was repaired died before the suite, the build or the smoke test started.
    Nothing about the e2e fix was wrong; it was simply never executed.
    ⭐ THE MISS IS THE INTERESTING PART, AND IT HAD BEEN WRITTEN DOWN TWICE. The tester reported the red gate
    in both of its first two runs and both times classified it as "a Prettier gate, and not one of the
    tracked baseline numbers". True about the NUMBERS, and the wrong conclusion about the WORKFLOW: a step
    that exits non-zero stops the job whether or not anybody counts it. A fact can be reported accurately,
    twice, and still not be acted on, because it was filed under the wrong question — "does this move a
    number we track" rather than "does this stop the build".
    Fixed by running the repo's own formatter: wrapping and indentation only, in files last touched on 2 and
    3 September. One of the fourteen was a hand-authored prose document committed an hour earlier at the top
    level; it moved into `docs/`, which `.prettierignore` already exempts by directory for exactly that kind
    of file.
- id: F-079
  title: A third refusal shape nobody can read
  tag: A list that appears twice
  status: open
  found_by: agent
  refs:
  - R-046
  story: >-
    Fixing DEF-0003 turned up a THIRD payload shape for the same refusal. `move_run` (migration 0030, the
    only definition) raises `not_offered_here` for a bulk crew check as
    `{kind, node_id, operators}` — no `id` at all, because it is a refusal about MANY operators with the
    list under `operators`. The parser still requires `id`, so that one keeps falling through to Unknown and
    "Some of this crew do not belong to that part of the structure." never reaches a screen either. This is
    not the same shape minus a key: deciding what `id` means for a many-row refusal is a contract decision,
    which is why it was left rather than folded into DEF-0003's fix. Three shapes now leave the same guard
    family, which is the duplicated-list hazard in its exact form — the shapes are written in SQL, read in
    TypeScript, and nothing makes the two red together.
- id: F-080
  title: The offering rule is written twice, and the two copies are now deliberately different
  tag: A list that appears twice
  status: open
  found_by: agent
  refs:
  - R-272
  - R-317
  story: >-
    DEF-0002's fix made `productOfferedAt` fail CLOSED on a place it cannot resolve. `cycleTimes.ts` holds a
    second, hand-inlined copy of the same predicate with its own `if (place === undefined) return true`, and
    that copy is RIGHT where it stands: `buildCycleGrid`'s map is built from every node the reader may read,
    so it is narrowed by permission, not by a view choice — which is exactly why the Cycle times grid was
    giving the right answer while the board was not. So the two copies must now differ on purpose, and
    nothing in the tree says so or makes them red together. The rule to apply when reading either: ask what
    narrowed the map. A permission-narrowed map means "I cannot tell", and the honest answer is to offer;
    a view-narrowed one means "not here", and the honest answer is to hide.
    ⚠️ AND THE RULE HAS A LIMIT, FOUND BY DEF-0005 THREE HOURS LATER. It can only be applied by someone who
    knows what narrowed the map — and for a supervisor BOTH had happened: the board's map was narrowed by a
    view choice while the product's place list had already been narrowed by PERMISSION, one layer up, before
    it arrived. By the time a client-side predicate saw an empty array the two were indistinguishable. The
    product half of the rule is therefore retired rather than refined: migration 0042 moved the question to
    the server, and `scope.ts` no longer decides where a part may be run. The rule still governs the operator
    half (`ownedInScope`), and the limit is written into the file's header beside it.
- id: F-078
  title: The settings icon was a sun
  tag: Words matter
  status: fixed
  found_by: maintainer
  refs:
  - R-320
  story: >-
    The Settings entry in the admin rail drew a circle with eight straight rays radiating out of it. The
    code even called it a gear — `case "settings": // a gear` — and it was not one: a gear's teeth are ON
    its rim, and eight detached spokes around a hub is the universal drawing of a sun. The maintainer read
    it off the rail exactly that way: *"it looks like a mini sun right now, wouldn't the universal gear
    symbol be more accurate?"* It matters most in the COLLAPSED strip, where the icon is the only thing
    left — a sun there says brightness or weather, and the one section a person hunts for by its
    conventional symbol is settings. Replaced with a real six-tooth cog outline (one closed path
    alternating a tip arc with a root arc, plus a hub). Six teeth and not eight because at 16 pixels eight
    tips and their gaps fall closer together than the stroke is wide and silt up into a plain ring.
    ⚠️ NO TEST PINS THE SHAPE, deliberately. A path string can be asserted, but what went wrong here was
    not a wrong string — it was a drawing that did not look like the thing its own comment named, and only
    a person looking at it can catch that. The evidence is the screenshot, at both rail widths.
- id: F-077
  title: A target computed from the standard is not the standard
  tag: Words matter
  status: fixed
  found_by: maintainer
  refs:
  - R-316
  - R-318
  story: >-
    The edit pop-up read **"Standard for this cell: 12"** under the target box. The maintainer: *"it is not a
    standard, it is the target based on the standard. It is very misleading."*


    They are two different quantities and this feature introduced both. The **standard** is the cycle time —
    seconds to make one unit at one cell, set once on the Cycle times screen, and it does not move. The
    **target** is what that standard works out to for one assignment's window, and it changes every time the
    block is resized or its efficiency is edited. Twelve was the second thing wearing the first thing's name.


    Left alone it invites a specific mistake: somebody reads "standard for this cell" over a target box, and
    types the cycle time into it. That saves silently — 90 is a perfectly legal target — and the assignment
    then carries an explicit target of 90 units that no longer follows a resize, which looks like the
    derivation quietly breaking.


    The pop-up now says "Target from this cell's cycle time: 12", and the chip's tooltip says "(from cycle
    time)" instead of "(standard)". The prop behind both was called `standardQty` and is now `derivedQty`,
    because the name that misled the reader was also misleading the code. Two tests pin the wording, since a
    string is exactly what the type checker cannot see: one asserts the pop-up hint never opens with
    "Standard for this cell", the other that a derived tooltip never uses the word "standard" at all.


    Worth noting the shape rather than just the fix: nothing was broken. Every number was right, every test
    was green, and the defect existed entirely in what the screen called things. It took someone reading the
    words to find it.
- id: F-001
  title: The rule refusing that rename wasn't the one I was looking at
  tag: Worth remembering
  status: fixed
  found_by: agent
  stage: S06
  refs:
  - §19.46
  story: >-
    Opening the write permission completely didn't help. Only opening the *read* permission did — a row
    you're allowed to edit but wouldn't then be allowed to see gets refused, and the error names the write
    rule, not the read rule. Four rounds of bisecting to find, and it means any fix aimed at the obvious
    rule looks right and changes nothing.
- id: F-002
  title: A site admin couldn't rename their own site
  tag: Found by running it
  status: fixed
  found_by: agent
  stage: S06
  refs:
  - §19.46
  violates:
  - R-216
  story: >-
    The first thing one of them would try. Rights are stored against a place but *used* as a path down
    the tree, so renaming the very place you have rights over moves your own permissions out from under
    you halfway through the operation.


    The obvious fix opens a hole — it also lets a department admin drag their department into a different
    plant — so the repair is deliberately narrow, and a test proves the narrow version can't be reached
    any other way. One limitation is left standing and flagged in writing: a *department* admin still
    can't rename their own department. A site admin is fine.
- id: F-003
  title: Finishing the last piece as written would have quietly re-opened the safety switch
  tag: A planned change, refused
  status: fixed
  found_by: agent
  stage: S06
  refs:
  - §19.46
  story: >-
    There's a rule in the database that stops anyone building a tree with a level out of order, and a
    bypass reserved for migration tools. You asked for that bypass to be locked to the database owner,
    and it was. My own plan for stage 06 then said to change a nearby function in a way that — measured
    — hands the bypass back to anyone signed in, because the lock works by asking *who is calling* and
    that change makes the answer always "the owner".


    as it ships → bypass REFUSED for a signed-in user with the change → bypass ACCEPTED ← your lock undone


    So I didn't make it. The problem it was meant to solve — a confusing error message — is fixed a different
    way, and a test now fails if anyone tries the original change later.
- id: F-004
  title: The "this row will take it" mark has been drawing itself in the wrong row
  tag: Stage 08 · shipping since the drag first landed
  status: fixed
  found_by: agent
  stage: S08
  refs:
  - §19.49
  - D99
  story: >-
    The small green mark that says *drop it in here* has been rendering four pixels down, inside the row
    *below* the one it describes. Measured in a browser: the rows sit flush against each other, and the
    mark was positioned as though there were a gap between them.


    It is a piece of styling copied from somewhere it was correct to somewhere it wasn't — the two places
    measure from different edges. **Nobody caught it, including me, twice**, because every picture any
    of us ever made happened to put the target on the *last* row, where there is no next row to intrude
    on. My first fix then hid the mark completely inside the row's own green outline — same colour, same
    pixels. What shipped is the third attempt, and I looked at each one.
- id: F-005
  title: A rule I wrote contradicted its own comment two lines above it
  tag: Stage 09 · caught by reading, not by running
  status: fixed
  found_by: agent
  stage: S09
  refs:
  - §19.51
  violates:
  - R-233
  story: >-
    Site admins can't take away their own access to their plant — otherwise they lock themselves out and
    only a company admin can undo it. The comment I wrote described that narrowly: only the row that makes
    you the admin *of that exact place* is protected. The code I wrote refused *any* change to your own
    row, including harmless ones like adding yourself as a viewer on one of your own departments, which
    takes nothing away because the stronger permission above still applies.


    No amount of breakage-testing finds this — both versions are perfectly self-consistent. It comes from
    reading the comment and the code side by side, which is now a standing step.
- id: F-006
  title: Three pieces of code I'd written and argued for turned out to do nothing
  tag: Stage 09 · found by breaking it on purpose
  status: fixed
  found_by: test
  stage: S09
  refs:
  - §19.51
  story: >-
    Each one had a comment next to it explaining why it was needed. The run breaks each piece deliberately
    and checks whether any test notices — and for these three, nothing did, because something earlier
    already refused.


    Two of them were "read the row back afterwards and make sure the write actually happened", which is
    a rule I adopted after an earlier bug. It turns out that rule is narrower than I'd been applying it:
    **it's for writes that can fail *quietly*.** These can't — the database raises an error rather than
    silently writing the wrong thing. All three are deleted, with the measurement written down, rather
    than kept with an explanation nobody can check.
- id: F-007
  title: I told the build agent one line; it was two
  tag: Stage 10 · my own instructions were wrong
  status: fixed
  found_by: agent
  stage: S10
  refs:
  - §19.52
  story: >-
    There's an audit that stops a stylesheet from shipping without being scaled for large displays, and
    it keeps a list of the files it covers. My brief said adding the new screen's stylesheet to that list
    was a one-line change. It also needed a second file updated — a test that hard-codes the same list
    — and without it the suite would have gone red the moment the required line landed.


    The agent found it, fixed it the way that file's own comment says to, and reported it. **That's the
    fourth brief in a row with a real error in it, and the fourth time the agent caught it** — which is
    the argument for writing the brief down rather than just building the thing myself.
- id: F-008
  title: People with no email address vanish from a search with nothing said
  tag: Stage 10 · found by looking at a picture
  status: fixed
  found_by: agent
  stage: S10
  refs:
  - §19.52
  story: >-
    The search matches on the address, because the address is the only thing this system knows about a
    person. So an account with no address on file can never be found by typing — it just disappears the
    moment you search, and nothing tells you it's there.


    That's the same failure as silently shortening a list, which the screen already guards against one
    line higher up. It now counts them and says so.
- id: F-009
  title: One row was printing the same sentence twice
  tag: Stage 10 · found by looking at a picture
  status: fixed
  found_by: agent
  stage: S10
  refs:
  - §19.52
  story: >-
    A company admin reaches every plant without being given access to any of them, so their row explains
    that — and then, two columns to the right, explained it again in almost the same words. The second
    sentence exists to say why there's no "Remove" button; the reason was already sitting next to it.


    Shortened to four words. **No test could have found this** — both sentences were correct, and a suite
    can't see that they're side by side. It took one screenshot. The check that guards it now asserts
    the two are *different*, so it can't come back.
- id: F-010
  title: The demo script hijacked two of the sample company's accounts
  tag: My mistake, and a bad one
  status: fixed
  found_by: agent
  stage: S10
  refs:
  - §19.53
  story: >-
    I gave the two demo site admins account numbers that were already taken — they belong to the *second*
    sample company's admin and to Sofia. So the insert quietly did nothing, the next statement renamed
    both of those people, and I attached a second company membership to each of them.


    Nothing complained, because the database allows one account to belong to two companies. It broke two
    layers away: signing in returned two memberships where the app expects one, so the session ended up
    with no membership at all — no Admin link for anybody, and a site admin being told they had no access
    to a plant they ran.


    **Every assertion I'd written passed**, because they all asked about the demo and none asked whether
    the numbers were free first. The script now refuses to run if those accounts belong to anyone else,
    and checks that no demo account ends up in two companies.
- id: F-011
  title: '"Why show people if they''re not assigned to a plant?"'
  tag: Stage 10 · you asked the right question
  status: fixed
  found_by: maintainer
  stage: S10
  refs:
  - §19.55
  violates:
  - R-237
  story: >-
    The list of everybody in the company was there for a reason — it's the pool you add from, and giving
    a site admin somebody to pick was the entire point of stage 09. But sitting it permanently under the
    people who actually have access **asserts a relationship that doesn't exist**, and in a real company
    it buries the list you came to read under hundreds of strangers.


    Adding is now an action. The default view is just the people who can get in; a stranger appears only
    when you search for one. That also retires a limit I'd written down and hadn't taken seriously enough
    — that list had no upper bound, so a company of ten thousand would have rendered ten thousand rows.
- id: F-012
  title: A site admin could remove the company admin
  tag: Stage 11 · you found it
  status: fixed
  found_by: maintainer
  stage: S11
  refs:
  - §19.54
  violates:
  - R-238
  story: >-
    Measured before I touched anything, because the size of a problem decides the size of the fix: it
    was **not** an escalation and took nothing away. A company admin's authority lives in a field a site
    admin cannot write, so the thing being deleted was a redundant duplicate — they still reached every
    plant afterwards.


    It was still wrong three ways. It's a role inversion, the person with less authority editing the record
    of the person with more. It lies — the button appeared to remove someone's access and removed nothing.
    And if that person ever lost the company-wide flag, a permission a site admin had quietly deleted
    would be gone.


    **Fixed in the database first, then on the screen.** Hiding a button the server still allows is a
    lie of omission, and this whole feature is built on the opposite rule: anything the screen hides,
    the database must also refuse.
- id: F-013
  title: There was never a line anywhere asking for a login screen
  tag: You read the plan and found two holes in it
  status: fixed
  found_by: maintainer
  stage: S24
  refs:
  - P1-6b
  - P1-6c
  story: >-
    You thought it would already be on the roadmap. It wasn't. I searched the whole file: the only matches
    for sign-in are the *developer* switcher from back in August, and one passing mention in a seed script.


    What stood in for it was a single unticked bullet — *"auth, profiles, subtree grants, RLS wiring"*
    — and three of those four shipped months' worth of work ago. So the line read as nearly done, and
    the one part that had not been started at all was the front door. **That is how a missing front door
    hid in plain sight, in a document written specifically to stop things hiding.**


    It is now four explicit items with the hard part named: the sign-in page is small, invitations need
    server-side code that does not exist yet, and until both land nobody but you can log in.
- id: F-014
  title: The level drag was built, unreachable, and marked "not written" in my own plan
  tag: Stage 12 · you found it, twice
  status: fixed
  found_by: maintainer
  stage: S12
  refs:
  - §19.56
  violates:
  - R-230
  story: >-
    You asked for this in the first place; it was built in stage 08. The queue entry for it was never
    ticked off, so it sat there reading *not yet written, blocked* for five days after the code shipped.
    When you said the feature was missing, my own roadmap backed you up. **A list nobody reconciles against
    the disk stops being a plan and becomes a second, confident, wrong answer.**


    So rather than argue about it, I rendered one level row from its own stylesheet and tested **every
    single pixel** against the rule the code itself uses to decide whether a press starts a drag. Green
    below is everywhere that works:


    Green starts a drag. The red line is the middle of the row. Those three green dashes on it are the
    whole target: **21 pixels of 526**.


    16% of the row works if you count the hairlines above and below the boxes. Along the middle, where
    a hand aims, it is 4%. There is no grip and the cursor never changes — **the only cursor that changes
    anywhere on that row is over the buttons, which are the parts you can't drag.**


    The reason it has no grip is written in the code and it is half right: a finger gets the ↑/↓ arrows
    instead, so a touch drag doesn't fight the page scroll. True — but the mouse lost its grip in the
    same stroke, and nothing gave it back. **676 passing checks cannot see an invisible control**, because
    not one of them is aimed at a pixel.
- id: F-015
  title: The app's type definitions are one database change behind
  tag: Stage 11 · checked rather than assumed
  status: fixed
  found_by: agent
  stage: S11
  refs: []
  story: >-
    The helper stage 11 added is available to the app and does not appear in the generated file that tells
    the app what exists. A database change and its regenerated types are supposed to be *one* change here;
    this pair has come apart, and nothing has broken yet only because nothing in the app calls it directly.


    One command, at the top of this page. I mention it as a finding rather than a chore because the rule
    it breaks — regenerate in the same sitting — is one I wrote down after it cost a build seven type
    errors, and it still slipped.
- id: F-016
  title: The CSV import is missing a second premise, and creating a site quietly copies a structure
  tag: Stage 16 · the surveys found it
  status: fixed
  found_by: agent
  stage: S16
  refs:
  - §19.57
  violates:
  - R-015
  story: >-
    We already knew nodes have no external reference to match an imported row against. The survey found
    that **products have the column and no uniqueness rule on it**, so the products half can't match either.
    Two missing premises, not one.


    And a third thing nobody would have looked for: since stage 09, creating a top-level site makes it
    its own *copy* of a structure. That is exactly right on a screen where you add one site at a time,
    and exactly wrong for an import of twelve, where it would silently manufacture twelve structures.
    The written description of that function still describes how it behaved before stage 09 — so anyone
    writing this from the documentation would have inherited the error before starting.
- id: F-017
  title: Products don't have a colour — they have a position
  tag: Stage 15 · the surveys found it
  status: fixed
  found_by: agent
  stage: S15
  refs:
  - §19.57
  - §19.59
  story: >-
    There are exactly four product colours and they are handed out **by position in a company-wide list**.
    So adding a product re-shuffles the colours of the products you already have, and the fifth product
    has no colour at all.


    This has never mattered because nothing has ever listed products for editing. A Products screen cannot
    avoid showing a colour, and there isn't a stable one to show — which is why it's a question for you
    at the top of this page rather than something I quietly pick.
- id: F-018
  title: A site admin can open three screens whose every edit the server will throw away
  tag: Stage 15 · the surveys found it
  status: fixed
  found_by: agent
  stage: S15
  refs:
  - §19.57
  violates:
  - R-239
  story: >-
    Operators, products and shift patterns are still governed by the old company-wide rule. A site admin
    can edit none of them — **and the admin page lets them in.** Nothing shows this today only because
    those three screens don't exist yet.


    This is stage 11 read backwards. Stage 11 was *anything you hide, the server must also refuse*. This
    is *anything you show, the server must also allow* — and it's the more dangerous half, because the
    failure looks like success: the form accepts, the button clicks, and nothing happens. It's why the
    shared-lists change moved to the front of the queue.
- id: F-019
  title: The new hover tint landed one pixel from the green line and turned it into a border
  tag: Stage 12 · found by rendering it
  status: fixed
  found_by: agent
  stage: S12
  refs:
  - §19.56
  story: >-
    The green insertion line sits three pixels above its row. The hover tint I'd just added reached four
    pixels above the same row. So on *every* drag — because during a drag your pointer is always over
    some row — the tint's edge landed one pixel from the green line, and the line stopped reading as "it
    goes between these two" and started reading as "this row has a green top border".


    No test could see this: both pieces are correct on their own. The tint now stands down while a drag
    is live, because once you've grabbed the row the question it was answering is already answered.
- id: F-020
  title: The grip has been effectively invisible on both admin screens since the day it shipped
  tag: Stage 12 · found by measuring, not looking
  status: fixed
  found_by: agent
  stage: S12
  refs:
  - §19.56
  story: >-
    The node tree's drag handle, and the one I was about to copy onto the levels list, are drawn in a
    grey that measures **1.29 to 1** against the card behind them. Three to one is the floor for something
    you're meant to find with your eye. On the hover background it measures **1.04 to 1** — it disappears
    at the exact moment you hover it.


    It reads as "subtle" in a screenshot, which is why nobody caught it, and it is why I compute the number
    now instead of squinting. Shipping the new grip at the old value would have been this stage's own
    defect wearing a different colour. Both screens fixed together, so they stay identical — being identical
    is the whole point of the copy.
- id: F-021
  title: 'Behind the grip: nearly half of every drag promised a move and did nothing'
  tag: Stage 12 · you predicted this one
  status: fixed
  found_by: maintainer
  stage: S12
  refs:
  - §19.56
  violates:
  - R-228
  story: >-
    You wrote — "look for a bug behind the affordance once it is grabbable." There was one, and the reason
    nobody had found it is exactly the reason you predicted: **you cannot find a bug in a control you
    cannot grab.**


    With no way to drive your running app, I rendered the real row with the real stylesheet, drove the
    real code over it at 672 pointer positions, and fed every outcome through the real reordering function.
    **The maths was right: 528 out of 528 drops landed exactly where the green line promised.** And **231
    of those 528 — 44% — drew a green line that did nothing at all.**


    Dragging a level, the gap directly above it and the gap directly below it are both places it already
    is. Two dead zones on every drag. I fixed exactly this on the node tree a fortnight ago; the level
    list keeps its own copy of the rule and never got the fix. **The two screens keeping separate copies
    of one idea is now the third defect this project has paid for** — so the rule has moved to where the
    reordering function lives, and the piece of arithmetic that used to sit unguarded inside the screen
    now has 25 checks on it.
- id: F-022
  title: The up/down arrows have been rendering blue, and no screenshot I take can see it
  tag: Stage 13 · only your screenshot could show it
  status: fixed
  found_by: agent
  stage: S13
  refs:
  - §19.58
  story: >-
    In your screenshot the ↑ and ↓ on each level row are blue. Nothing else on that row is. It isn’t a
    stylesheet bug: those two characters have an emoji form, Windows falls through to an emoji font to
    draw them, and an emoji glyph brings its own colour — so the grey I set two lines above is simply
    ignored.


    **The part worth keeping: every render I have ever taken of that row showed them correctly**, because
    the machine I render on has no emoji font to fall through to. Rendering and looking is the highest-value
    rule on my list and it could not have found this. Fixed with the character that forces the plain form.
- id: F-023
  title: The check that guards the rule could be switched off without anything going red
  tag: Stage 13 · a deliberate breakage escaped
  status: fixed
  found_by: agent
  stage: S13
  refs:
  - §19.58
  story: >-
    The new check works from a list of things a screen isn’t allowed to write for itself. I tried deleting
    an item from that list to see what happened. **Nothing happened.** One fewer thing for the screens
    to violate, one fewer thing for the shared file to provide — so two separate checks both went *greener*,
    and the guard quietly covered less.


    This is the third time on this project that a list driving a test turned out to be untested itself.
    There’s now a check that asserts the list, so shortening it goes red in the same run.
- id: F-024
  title: Two screens, one gesture, five separate disagreements
  tag: Stage 13 · you found it
  status: fixed
  found_by: maintainer
  stage: S13
  refs:
  - §19.58
  violates:
  - R-D100
  story: >-
    You said the drag styling didn’t match. It didn’t, in five ways: the hover tint was a different colour
    on each; one had real padding and the other faked padding with a shadow; the grip block was written
    out twice; the fade was written out twice; and the grip sat in a different place on each screen.


    **Every line in both files was correct.** Nothing was misspelled, nothing was a typo — the defect
    was that there were two of everything, and two things that are maintained separately drift. One of
    the two hover colours was the three-unit grey I’d already measured as invisible, so “make them match”
    was one coin-flip away from making the second screen worse. **The answer to a mismatch is never “match
    them”; it’s “make it impossible to mismatch”**, which is the same conclusion this project reached
    about scaling three weeks ago and apparently had to reach again in a new domain.
- id: F-025
  title: A site admin could erase their own product’s colour
  tag: Stage 14 · found by walking the edges
  status: fixed
  found_by: agent
  stage: S14
  refs:
  - §19.60
  story: >-
    The colour is filled in automatically when a product is created, but nothing stopped someone clearing
    it afterwards — leaving a product with no colour and no way back except an admin. One line makes the
    column require a value; the interesting part is that adding it also *changed the verdict on one of
    the deliberate breakages*, which had been reported as harmless and only was harmless once the new
    rule existed. **A verdict on a test has a date on it.** The whole table gets re-run after any tightening.
- id: F-026
  title: “That plant doesn’t exist” — about a plant that plainly does
  tag: Stage 14 · a refusal that lied about why
  status: fixed
  found_by: agent
  stage: S14
  refs:
  - §19.60
  violates:
  - R-206
  story: >-
    A safety check ran as the person making the edit rather than as the system, so when it went looking
    for the plant an entry belongs to, it couldn’t see it either. The result was a refusal with entirely
    the wrong reason attached, **and it arrived first, hiding the correct refusal underneath it**. Two
    tests were asserting only “this was refused”, which is why it survived that long.


    Fixed, and the lesson is in the tests rather than the code: *a refusal test has to check what the
    refusal says, not just that one happened.*
- id: F-027
  title: Eight colours in a palette that has four
  tag: Stage 14 · the test I’d argued was unnecessary
  status: fixed
  found_by: agent
  stage: S14
  refs:
  - §19.60
  story: >-
    My own notes in the change file reasoned, at some length and quite plausibly, that one particular
    test wasn’t needed. I wrote it anyway. **It immediately found that the palette shipped eight colours
    while the stylesheet defines four** — so half the products would have come out with no colour at all,
    which is exactly the kind of thing nobody notices until a board looks wrong.


    Palette narrowed to four, and there’s now a check that fails if the two ever disagree again: widen
    the stylesheet first, then the palette. **An argument that a test is unnecessary is not evidence.
    The test is.**
- id: F-028
  title: The colour picker could be asked about another company’s products
  tag: Stage 14 · an agent I asked to break it found this
  status: fixed
  found_by: reviewer
  stage: S14
  refs:
  - §19.60
  violates:
  - R-243
  story: >-
    The new change gives each product a colour, and picks a sensible default by looking at what colours
    are already in use. That look-up ran with elevated privileges — it has to, to see rows the person
    can’t — **and it took the company to look in as an argument.** Anyone signed in could have handed
    it a different company’s identifier and learned something about their data. Small in itself; the category
    is not small.


    **I had read that file end to end three times and not seen it.** What found it was handing the finished
    thing to a separate agent whose only instruction was to break it. **And its suggested fix was wrong**
    — the obvious guard would have failed during the very step that fills in the existing rows, which
    I only knew because I measured it rather than accepting it. The right fix was to stop granting anyone
    permission to call it directly at all. *Reviewing your own work is a different instrument from someone
    trying to break it*, and that third pass is now standing procedure for anything I build myself.
- id: F-029
  title: A test whose name claimed something its own setup couldn’t produce
  tag: Stage 15 · two of my own new tests were wrong
  status: fixed
  found_by: agent
  stage: S15
  refs:
  - §19.61
  story: >-
    Two of the 36 new checks failed the first time I ran them, and neither was a bug in the code. One
    said “a target is never the thing itself or anything under it” against a node that *couldn’t get that
    far* — something under it had nowhere to go, so it was refused before any list was built. The other
    said “nothing at the same rung to move it under” while actually testing “no rung below”.


    **A test name is a claim, and the setup has to be able to deliver it.** Both are rewritten with a
    note saying what they were before, so the next person doesn’t reintroduce the comfortable version.
- id: F-030
  title: The most important thing this feature says would have read “Something went wrong”
  tag: Stage 15 · found by building the screen
  status: fixed
  found_by: agent
  stage: S15
  refs:
  - §19.61
  violates:
  - R-244
  - R-D74
  story: >-
    The whole point of moving something to a different rung being *refusable* is the case where work is
    already booked on it: *“you can’t move this, there are three shifts on it — move them first.”* The
    database was saying exactly that. It was packing it in a shape the app doesn’t know how to open, so
    what would have reached you is **“Something went wrong. Please try again.”**


    Every other place in the system that refuses for this reason packs it the same way as each other;
    this one function packed it differently, and no test compared them. Both are fixed in one small database
    change, and neither invents a new kind of error — they are the existing rules being kept where they
    were quietly being broken.
- id: F-031
  title: A note that never became code — for a whole day, and nothing noticed
  tag: Stage 15 · I had already found this, and written it down
  status: fixed
  found_by: agent
  stage: S15
  refs:
  - §19.61
  violates:
  - R-D74
  story: >-
    Before writing stage 03's database side I spent an afternoon measuring what it does when it goes wrong,
    and one of the things I measured was this: moving something into a place that already has something
    of that name comes back as a *raw database error*, with no explanation attached. I wrote the finding
    down in the design document, in a table, with the fix beside it. **Then I shipped stage 03 without
    the fix.**


    Thirty-three tests passed. They kept passing for a day. **The structural reason is the part worth
    keeping: every one of those tests asked what a legal move does, and not one asked what a refusal looks
    like.** A test suite written that way is complete about behaviour and completely silent about what
    you would have seen on screen. Every refusal this project shows a user now gets a test that checks
    the message it arrives with, not just that it arrived.
- id: F-032
  title: A menu item that opens onto nothing, four times over
  tag: Stage 16 · found while clearing the way for the next three screens
  status: fixed
  found_by: agent
  stage: S16
  refs:
  - §19.62
  violates:
  - R-246
  story: >-
    The admin screen keeps two lists that have to agree: the one that draws the buttons down the left
    side, and the one that decides what each button shows. **Nothing connected them.** Adding a button
    without its screen would have produced a menu item that opens onto a blank pane — and the commit I
    was writing adds four buttons at once, so it was four of those waiting to happen.


    There is now a check that reads both lists out of the file and fails if any button has nothing behind
    it. **One of its six deliberate breakages is worth a line:** a sloppier way of finding the list produces
    *exactly the same answer today* and would start being wrong the moment someone adds an unrelated list
    underneath it. That one needed a test written specially, or the boundary would have quietly re-opened
    later. Nothing visible changed in this commit — that is the point of it.
- id: F-033
  title: “You need to sign in to do that” — said to someone who is signed in
  tag: Stage 16 · all three surveys found the same thing
  status: fixed
  found_by: agent
  stage: S16
  refs:
  - §19.63
  violates:
  - R-247
  - R-046
  story: >-
    Before building the three screens I sent three agents to survey them, one each, reading the database
    as the authority. They came back agreeing on something none of them was sent to find: **none of these
    three screens has a single database function behind it.** They write their tables directly, and the
    permission rules from stage 14 are the only gate. That is fine and it is how the rest of the app already
    works — but **the part of the app that turns a database refusal into a sentence was written when every
    write went through a function**, so it had no words for any of this. I measured all five on a real
    database:


    **A site admin creating something company-wide** was told **“You need to sign in to do that.”** —
    which is how someone ends up signing out and back in to fix a permission they simply do not have.
    **A site admin editing a row that isn’t theirs** got **“Saved.”** and nothing changed — because a
    permission rule that hides a row doesn’t raise an error, it just quietly matches nothing. **A duplicate
    product code** and **a delete blocked by existing work** both said “Something went wrong.” And **two
    overlapping shifts** would have said *“Someone else changed this run first”*, because that particular
    error had exactly one possible cause when the code was written, and a shifts screen makes that false.


    All three lanes would have papered over the same five holes in three different ways. Fixed once instead,
    before any of them starts — the same argument as the groundwork commit, arriving from a different
    direction. **18 new checks, 11 deliberate breakages, all 11 caught**, and every test uses a real error
    message captured from the database rather than one I typed.
- id: F-034
  title: A break’s “Remove” sat a few pixels from the shift’s “Delete”
  tag: Stage 17 · found by looking at the picture
  status: fixed
  found_by: agent
  stage: S17
  refs:
  - §19.64
  story: >-
    Two destructive actions, on the same line of sight, at the far right edge — and the one that removed
    a *break* was nowhere near the break it belonged to, because it inherited a spacing rule written for
    the row above it. Nothing was broken; it just invited the wrong click. It now sits beside its own
    break.


    In the same picture: the sentence that warns you a delete is about to be refused was drawn in the
    app’s muted grey, which measures **3.5 to 1** against its background — below the readability floor
    for text that size. Fine for a column heading, not fine for the one line telling you why the button
    you are about to press will not work.
- id: F-035
  title: “You don’t administer a site” — told to a site admin, because a different read had failed
  tag: Stage 17 · the safety net had a hole where it mattered
  status: fixed
  found_by: agent
  stage: S17
  refs:
  - §19.64
  violates:
  - R-257
  story: >-
    The Products screen is deliberately cautious: if it cannot confirm which sites you run, it goes read-only
    rather than offering buttons that will fail. That is the right choice, and there was a message written
    for exactly that case — *“we couldn’t check which sites you administer, so this list is read-only
    for now.”*


    **The message could never appear.** It was gated on the check having come back, and the situation
    it existed for is precisely the one where the check does *not* come back. So in that case the screen
    fell through to a different sentence: *“You don’t administer a site, so there’s nowhere to add a product”*
    — a flat untruth, told to someone whose changes the server would have accepted, with every one of
    their own products simultaneously labelled as belonging to another site, and nothing on screen offering
    to try again.


    A cautious fallback whose explanation cannot render is indistinguishable from a lie. It now says the
    true thing, and it also waits for that check before drawing anything — the same dead screen used to
    flash briefly on every normal load.
- id: F-036
  title: One stray break made a shift’s times permanently uneditable — and blamed the break
  tag: Stage 17 · a door that locked behind you
  status: fixed
  found_by: maintainer
  stage: S17
  refs:
  - §19.64
  violates:
  - R-249
  story: >-
    When you edit something, the screen tries to show you only the problems *your edit* caused, not everything
    already wrong with the pattern. Sensible. It worked out which problems were “already there” by **comparing
    the sentences** — and the sentence for a break that sits outside its shift contains the shift’s own
    times. So changing the shift’s times rewrote that sentence, the screen decided your edit had *created*
    a new problem, and refused to save. Every time. The only way out was to delete a break you may not
    have wanted to delete, because the screen offers no way to move one.


    And the error it showed you named the break, not the times you had just changed. Problems are now
    identified by *which shift and which break* they belong to; the sentence is what we show, not what
    we compare.
- id: F-037
  title: >-
    Two different breaks, printed identically — and every after-midnight break read as twenty hours early
  tag: Stage 17 · a label that quietly meant two different things
  status: fixed
  found_by: agent
  stage: S17
  refs:
  - §19.64
  violates:
  - R-248
  story: >-
    The rule was “put the +1d marker on the *end* of a span only, never the start”, and it was justified
    by a real database rule: a shift cannot start on the following day. True — **of shifts**. The same
    piece of code also prints *breaks*, and breaks have no such rule; the sample data itself has three
    of them starting after midnight. So a break running 02:00–02:30 the next morning printed as **“02:00–02:30
    +1d”**, which by the screen’s own convention says it starts at two in the morning on the shift’s *own*
    day — twenty hours before the shift begins. Worse, two genuinely different, both-storable breaks printed
    the **identical** string.


    The comment explaining the shortcut wasn’t wrong. It was true about the table it was written for and
    quietly assumed about the second one.
- id: F-038
  title: A shift ending at midnight made one of its own breaks impossible to enter
  tag: Stage 17 · an agent I asked to break it found this
  status: fixed
  found_by: reviewer
  stage: S17
  refs:
  - §19.64
  violates:
  - R-248
  story: >-
    A shift that runs 16:00 to midnight is stored as “16:00 to minute 1440”, and the screen correctly
    labelled it **16:00–00:00 +1d**. But a second piece of the same code, asked “does this shift cross
    midnight?”, said **no** — off by exactly one minute. That answer is what decides whether the break
    form offers you the “+1 day” tick-box. Without the tick-box there is no way to type midnight at all:
    a clock field will not accept “24:00”. So the perfectly ordinary 23:45–00:00 wash-up break was **unenterable**
    — and our own validation refused it with “this break ends before it starts”, on a row the database
    would have accepted without complaint.


    **The thing to notice is that one object was answering the same question three different ways** and
    no test compared them to each other. One check that says “these three must agree” would have caught
    it. That check now exists.
- id: F-039
  title: Long lists get cut off at 1,000 rows and the app is not told
  tag: Stage 17 · my call, not yours — and I explained it badly
  status: owed
  found_by: agent
  stage: S17
  refs:
  - §19.64
  violates:
  - R-253
  story: >-
    **Plainly: if you ever have more than a thousand of something, the app quietly gets the first thousand
    and believes that is all of them.** More than a thousand people. More than a thousand products. More
    than a thousand training records — which is only about 350 people with three trainings each, so that
    is the one you would reach first.


    **Why it is worse than a truncated list.** The Operators screen does not just display data, it works
    something out from it — it takes your people, their trainings, and what each cell requires, and decides
    who can work where. If a training record gets cut off, **Ben shows a red cross and “missing CNC” for
    a cell he is fully trained for**, and nobody schedules him there again. If a requirement gets cut
    off instead, the opposite: a green tick for a cell the system will refuse the moment you try to book
    it. The screen looks completely normal either way.


    **You do not need to decide anything, and asking you to was my mistake.** I offered you two options
    that were both just “how” — neither was a business question. Here is what I will do: **fetch long
    lists in batches until there are none left, so nothing is ever silently cut**; and where the app is
    *working something out* rather than just listing, **have it say so plainly instead of showing a confident
    answer built on incomplete data**.


    **What you would notice today: nothing**, because nothing here is near a thousand rows. It matters
    the day a real plant is loaded, and it is far cheaper to fix before that than after.
- id: F-040
  title: Two different complaints about the same shift were being treated as the same complaint
  tag: Stage 18 · found by breaking my own new tests
  status: fixed
  found_by: agent
  stage: S18
  refs:
  - §19.65
  violates:
  - R-249
  story: >-
    When you edit a shift, the screen shows only the problems *your* edit caused. To do that it has to
    recognise which problems were already there — and it identified them by which shift and which break
    they belonged to, but not by *what kind* of problem they were. So a shift that already had a naming
    complaint could be given an illegal time, and the new complaint would be mistaken for the old one
    and swallowed. **The save would have gone through silently.**


    Nothing found this by reading. I broke the identification rule on purpose to check the new tests would
    notice, they didn’t, and that turned out to be a real hole rather than a harmless change.
- id: F-041
  title: >-
    The hint under the product form said colours never change — one line above the new colour picker
  tag: Stage 18 · a sentence that outlived what it described
  status: fixed
  found_by: agent
  stage: S18
  refs:
  - §19.65
  story: >-
    Making the swatch clickable made that sentence false. It is a small thing with a sharp edge: **a hint
    describing the old behaviour is worse than no hint at all**, because it actively tells someone the
    control in front of them does not exist, and they will believe the words over the button. Changed
    in the same edit.
- id: F-042
  title: My first fix for the breaks list had the same bug as the thing it was fixing
  tag: Stage 18 · a table that was pretending to be one
  status: fixed
  found_by: agent
  stage: S18
  refs:
  - §19.65
  violates:
  - R-250
  story: >-
    You asked why breaks weren’t tabular. I made them a table — and set the name column to take a share
    of whatever width was going, which stretched it across the entire panel and left “Lunch” six hundred
    pixels from “10:00–10:30”. Columns that far apart are not a table; you still have to read each line
    on its own. **It is the identical mistake that had thrown a break’s “Remove” link to the far right
    edge the day before**, which I had just finished fixing.


    A short list should occupy the width it needs and stop. The only thing that caught it was rendering
    the page and looking at it.
- id: F-043
  title: Nothing said a shift pattern row could be opened
  tag: Stage 18 · you found it
  status: fixed
  found_by: maintainer
  stage: S18
  refs:
  - §19.65
  violates:
  - R-251
  story: >-
    The pattern name was a button drawn with no border and no background — identical, pixel for pixel,
    to the plain text in the column next to it. Behind it sat every shift in that pattern. You found it
    by clicking on the off-chance; someone new would have concluded the screen was empty.


    An earlier round of this project established that *a row must say what it is* — that is why every
    level row now names its level instead of relying on indentation. This is the same rule arriving from
    the other side: **a row must also say what it does.** Neither is visible to any test.
- id: F-044
  title: A break could only be deleted and retyped, while the write to edit one sat unused
  tag: Stage 18 · you found it — and the code for it already existed
  status: fixed
  found_by: maintainer
  stage: S18
  refs:
  - §19.65
  violates:
  - R-250
  - R-D105
  story: >-
    Moving a break by five minutes meant removing it and adding it again — a destructive action offered
    for a change that destroys nothing, and one that silently lost the break’s name along the way. **The
    function to do it properly had been written, tested and given its own error handling, and nothing
    on screen ever called it.**


    That shape has now caught us twice. The first time it was a piece of state written once and never
    read; this time it is a piece of code exported and never imported. Both mean the same thing: **a requirement
    was dropped somewhere between the plan and the screen, and the leftover is the fingerprint.** Searching
    for it is close to free.
- id: F-045
  title: “What colour is this product” was answered in three different files
  tag: Stage 19 · three copies of one rule, found while changing it
  status: fixed
  found_by: agent
  stage: S19
  refs:
  - §19.66
  story: >-
    The admin screen had the answer, the board grid had its own copy, and the board legend had a third
    — with a comment on the board copies saying they were *kept in step with* the admin one. That sentence
    is the definition of a rule held together by somebody remembering.


    Adding the hex option is precisely the edit that breaks it: a hand-set colour would have been right
    on the settings screen and drawn as the default blue on the board, with all three files individually
    correct. **This is the same defect as the drag colours in stage 13**, and the same fix — move the
    rule somewhere everything can reach, rather than matching copies by hand. The reason there were three
    was a rule that the board may not borrow code from the settings screens; the answer was to put it
    where neither owns it.
- id: F-046
  title: 'The colour check would have accepted “teal #1baf7a” as a colour'
  tag: Stage 19 · found by breaking the new check on purpose
  status: fixed
  found_by: agent
  stage: S19
  refs:
  - §19.66
  violates:
  - R-256
  story: >-
    Letting you type a hex code means the database has to know what one looks like. I wrote that check,
    wrote five tests for spellings it must reject, and they all passed — then broke the check deliberately
    to see whether the tests would notice, and they did not. **Every rejected spelling I had thought of
    was also the wrong LENGTH**, so not one of them could tell “this string IS a colour” from “this string
    CONTAINS one”.


    A string that holds a perfectly good hex and is not one is the only input that separates them — and
    it is exactly what a paste out of a design tool looks like.
- id: F-047
  title: The Products screen asked the wrong question about who may edit a row
  tag: Stage 19 · it had been blocking you and neither of us saw it
  status: fixed
  found_by: maintainer
  stage: S19
  refs:
  - §19.64
  - §19.67
  violates:
  - R-257
  - R-239
  story: >-
    It decided by asking which *structures* you administer. The database decides by asking which *places*
    you administer. Those sound like the same question and are not: a site whose structure is shared with
    another site is deliberately left unclaimed by an older migration, so its admin dropped out of the
    first list entirely — **every button greyed out, every one of their own products labelled as another
    site’s, while the server would have accepted every change they tried to make.**


    The failure was one-directional and it was the worst direction: a wrong “no” is invisible and permanent,
    because a screen that refuses looks exactly like a screen with nothing to do. It now lets you try
    and shows the server’s answer — which, since the error-message work two stages back, is a plain sentence
    rather than a shrug. **The reason the default could flip is that we fixed the error messages first;**
    before that, guessing wrong meant a screen that lied either way.
- id: F-048
  title: The check I wrote to catch that mistake could not catch it
  tag: Stage 19 · my own new check reported a fault that did not exist
  status: fixed
  found_by: agent
  stage: S19
  refs:
  - §19.67
  story: >-
    Two things wrong with it, both found by deliberately breaking working code to see whether it noticed.
    First it read the wrong slice of the file and reported a fault in code that was correct. Then, once
    that was fixed, **I deleted the exact line it was written to protect and it stayed green** — because
    a leftover type declaration still mentioned the field, and the check could not tell “this code writes
    the value” from “this code mentions the name”.


    Worth saying because it is the whole argument for breaking things on purpose: **a check that has only
    ever run against working code tells you nothing about whether it can fail.** Half of its cases now
    run against deliberately broken versions.
- id: F-049
  title: I kept building the “add” form and leaving the “edit” form short
  tag: Stage 19 · you told me three times
  status: fixed
  found_by: maintainer
  stage: S19
  refs:
  - §19.66
  - §19.67
  - D105
  violates:
  - R-D105
  - R-D106
  story: >-
    You could choose where a product belonged when you created it, and never change it afterwards. Same
    for a person. Same for a shift pattern. **Three separate screens, the same mistake, and I did not
    see the pattern until you pointed at it for the third time** — because from where I was looking the
    feature worked: the picker was there, on the form I had just built.


    **It is the same defect as the break you could only delete and retype**, two stages back, wearing
    different clothes. And it is worse than a missing button, because it quietly says *where this belongs
    is decided when it is born* — which for a line that gets reorganised is simply untrue.


    All three now have it on the edit form, and **there is a check that fails the build if anything you
    can set when creating a row cannot also be changed afterwards.** Not a note to myself — the same move
    as the drag colours in stage 13 and the panel switches in stage 16: make the rule structural rather
    than remembered.
- id: F-050
  title: Deleting a person would have failed because of a shift they had already worked
  tag: Stage 21 · would have shipped broken
  status: fixed
  found_by: agent
  stage: S21
  refs:
  - §19.74
  violates:
  - R-D110
  story: >-
    Keeping someone’s finished work means rewriting those rows to carry their name instead of a link to
    them. Rewriting a shift wakes up the check that stops anyone being booked past their capacity — and
    with nobody attached to the row any more, that check measured the shift against nothing and refused
    it. **Anyone who had ever worked a full shift would have been undeletable**, and the failure would
    have read as “delete is broken”, not as anything to do with capacity.


    A second one of the same kind sat next to it: a safety check that reads “is this person allowed here”
    gave up early once nobody was attached, and skipped the “is this part allowed here” question underneath
    it. Neither is visible from the happy path; both have their own check now.
- id: F-051
  title: >-
    The People screen refused to delete anyone holding a training, and told you to do work that no longer
    exists
  tag: Stage 21 · a rule the database no longer has
  status: fixed
  found_by: agent
  stage: S21
  refs:
  - §19.74
  violates:
  - R-239
  story: >-
    It said *“3 tickets are still attached to this person. Remove them first, or deactivate them instead.”*
    That was correct when the database would have refused the delete anyway. It does not any more — a
    person’s trainings now go with them — so the screen was enforcing a rule the database does not have,
    and the way out it named was work nobody needed to do.


    **This is the more dangerous half of the pair above.** A stale permission check fails loudly the first
    time somebody tries it. A stale *refusal* never fails at all: it quietly stops people doing something
    they are allowed to do, and nobody reading the screen has any way to find that out.
- id: F-052
  title: The app was still saying “company-wide” a day after company-wide stopped existing
  tag: Stage 21 · a sentence, not a bug
  status: fixed
  found_by: agent
  stage: S21
  refs:
  - §19.74
  violates:
  - R-D108
  story: >-
    A refusal message offered *“Company-wide products can only be changed by a company admin.”* That state
    was removed the day before. The compiler cannot see inside a sentence, so it said nothing — **and
    there was a passing test that checked for the exact wrong words**, which is worse than no test, because
    it reads as coverage.


    Three more of the same kind turned up in the same pass, all found by searching for the words rather
    than by any tool: two places on the People screen that still drew a “company-wide” badge, and a note
    on the Shift Patterns screen telling you to detach a pattern before deleting it — which this change
    made untrue.
- id: F-053
  title: I removed the permission check from the delete and every single test still passed
  tag: Stage 21 · found by breaking it
  status: fixed
  found_by: test
  stage: S21
  refs:
  - §19.74
  story: >-
    The routine that deletes a part checks up front whether you administer the site it belongs to. I took
    that check out to prove the tests would notice. **They did not.** Not because the check is useless
    — a second gate underneath still refuses the final step and it produces the same error code — but
    because the code was all anything was looking at.


    What actually changes without it is the sentence you read: *“you don’t have admin rights over this
    site”* becomes *“the product itself could not be deleted”*, which tells you nothing you can act on,
    and it arrives after the work has been done and rolled back rather than before it was attempted. A
    check now reads the message, not just the code.


    **This is the point of breaking my own work on purpose.** Fifteen of sixteen breakages were caught
    immediately; this was the one that wasn’t, and “not caught” with no explanation is a hole — so it
    got one.
- id: F-054
  title: I added a stylesheet to a folder that is audited and didn’t add it to the audit
  tag: Stage 21 · an audit catching me
  status: fixed
  found_by: test
  stage: S21
  refs:
  - §19.74
  story: >-
    The two red checks on your run were both this. There is a check that walks the admin folder and fails
    if any stylesheet in it is not on the list of files being audited for sizing — it exists because exactly
    this happened once before and went unnoticed until someone opened the app on a large monitor. **It
    worked.**


    Worth saying plainly: **this is the class of thing I cannot catch from here**, because that suite
    only runs on your machine. What I could have done was search for the list when I created the file
    — the list names its own folder in a comment. That is now the standing move. The fix is measured rather
    than predicted: the list is complete, removing the new entry makes the audit name it again, and the
    new file has no unscaled sizes.
- id: F-055
  title: The number I hand you to check my work against had been wrong by two since last session
  tag: Stage 21 · found by your run
  status: fixed
  found_by: maintainer
  stage: S21
  refs:
  - §19.74
  story: >-
    The whole convention is that I predict the test count and you check it matches *exactly*, because
    a different number means a file didn’t load. I predicted 1116; you got 1118. **The gap was not a file
    failing to load — it was the number I was counting up from.** Last session’s confirmed total was written
    down as 1105 and should have been 1107; nothing changed between, it was simply transcribed wrong.


    **Two is a small error and it is the worst possible kind here**, because it doesn’t look like an error
    — it looks like a broken suite, every time, forever, and the real signal gets lost in it. Corrected
    in the plan and in my notes, and the rule I broke is now written down: when a run confirms a count,
    copy the runner’s own total line, never a number I reasoned my way to.
- id: F-056
  title: >-
    I retyped a routine instead of extracting it, and silently dropped three of its safety checks
  tag: Stage 20 · caught by auditing my own change
  status: fixed
  found_by: test
  stage: S20
  refs:
  - §19.76
  story: >-
    Two of the three write paths needed two new arguments threaded through. For one of them I typed the
    routine out again from what I remembered of it — and the version I typed was missing its shape validation,
    its per-place permission checks, and one line that sets a starting value. It surfaced as a baffling
    error about a completely unrelated field. **A second routine had the same treatment and I had not
    noticed at all: two permission checks that used to be one, now answering with two different sentences.**


    Fixed by asking the database to print the routine it is actually running and changing exactly the
    words that needed changing — with each change asserted to have matched something, so a change that
    silently matches nothing cannot pass as done. The third path had been extracted properly and was clean,
    which is the comparison that makes the point.
- id: F-057
  title: Seventeen checks all answered correctly, and not one of them reached the rule
  tag: Stage 20 · a test proving nothing
  status: fixed
  found_by: agent
  stage: S20
  refs:
  - §19.76
  story: >-
    The new checks needed a person who can schedule on a cell but is *not* a company admin — the exact
    person the override is for. I gave them the wrong company-wide role, and the permission gate reads
    the company-wide role first, so **every one of the seventeen was refused before it ever got near the
    area rule**, and every one of them was refused with the answer the test expected. Green, and testing
    nothing. Two more had the same shape for a different reason: they read “no error” as “it worked” on
    an edit — but an edit the database refuses silently changes nothing and raises nothing. Those now
    read the row back and check it actually changed.
- id: F-058
  title: A test can pass for a reason that has nothing to do with what it is testing
  tag: Stage 20 · the instrument, not the code
  status: fixed
  found_by: agent
  stage: S20
  refs:
  - §19.76
  story: >-
    **Fifteen deliberate breakages, and two of them came back “caught” when they had not been caught at
    all.** The runner builds each broken copy by find-and-replace, and one of its own replacements was
    too eager — it rewrote a file path into one that does not exist. A run against a missing file produces
    no passing checks. No passing checks looks identical to *every check failed*, which is what “caught”
    means. So the instrument reported success for two breakages it never actually tested.


    **The reason this is worth writing down: I have a rule for the opposite case and it did not help here.**
    When a breakage comes back *uncaught* I already treat it as a hole until proven otherwise. What I
    did not have was any suspicion of a *caught* verdict — the good news — and that is the one that quietly
    certifies work nobody tested. **A pass can be as false as a failure, and it is much easier to accept.**
    Both runs were redone against real files.
- id: F-059
  title: One deleted part with history, and the board stops loading — for everyone
  tag: Stage 21 · the largest one yet
  status: fixed
  found_by: agent
  stage: S21
  refs:
  - §19.76
  violates:
  - R-273
  - R-268
  story: >-
    **This is the feature from two days ago breaking the screen, and the feature is the one that was supposed
    to protect it.** Keeping the past means that when a part is deleted, a run that already made it stops
    pointing at the part and keeps its name, code and colour instead. That is the whole point. But the
    app’s reader still *demanded* a part on every run — and when it meets a run without one it rejects
    that run, and rejecting one row makes it throw away the entire list. **Not a missing name on one bar.
    A blank board, for everybody in the company, with an error message about a data shape.


    Nothing I own could have caught it.** The compiler was clean, because the type definitions it reads
    are generated from the database and describe columns, not the hand-written check underneath. The database
    suite was green, because it never parses anything. The demo world has never had a delete run against
    it, so no screen ever met the shape. **I found it because I opened that file to add an unrelated field.


    The rule that comes out of it, and it is now written into the process:** a database change that makes
    a column *optional* is a change to the app, and it is the one kind the type generator will not surface
    — the app keeps compiling and starts refusing real rows. After any such change, search the app for
    that column by name and read every check that mentions it.


    Underneath it sat the softer half of the same gap: even once the row loaded, every part of the board
    looked a part up by its link, and a deleted part has none — so it would have drawn as *“(unknown product)”
    in grey*, which is exactly the outcome remembering the name was added to prevent. **The columns shipped
    and nothing read them.** Both halves are fixed together, with twenty new checks over the piece that
    does the drawing.
- id: F-060
  title: The Operators screen told you someone can work in plants they are not allowed to enter
  tag: Stage 20 · you found it in a minute
  status: fixed
  found_by: maintainer
  stage: S20
  refs:
  - §19.77
  violates:
  - R-275
  - R-239
  story: >-
    **You opened a person who belongs to one line in Plant A, and the screen listed every cell in all
    three plants and ticked twelve of them.** It asks each cell one question — *does this person hold
    the trainings this cell needs?* — and never asks the second one, which is whether they are allowed
    to be in that part of the plant at all. **The only cells the database will actually accept are the
    two under their own line, and both of those are crosses.** The true answer is **zero** places. The
    screen said twelve of eighteen.


    **The person’s own “belongs to” is sitting right there in the data the screen is handed.** It is written
    into the type with a note explaining that it binds scheduling, and the loop underneath never reads
    it.


    **★★ This is the dangerous direction, and it is the opposite of the two stale rules I deleted yesterday.**
    Those refused things the database allows — quietly annoying. This one *permits* things the database
    refuses. A supervisor plans a week from this screen and gets turned down at the moment they try to
    book it, with an error that says nothing about why the screen said yes. **A screen that looks like
    it works is the worst of the set.


    ★ And the fix is not to hide the other plants** — because of the decision you made yesterday, a supervisor
    *may* put someone outside their area with a reason. So the honest screen has three answers, not two:
    **can work here**, **missing the training**, and **outside their area — allowed, but someone has to
    say why**. The count has to name what it counts, too: *“0 of 2 places in their own area”*, with everything
    else listed below it. Written down as the next item; no database change needed.
- id: F-061
  title: Labelling the other plants was not enough — they had to go
  tag: Stage 20 · your second look, same screen
  status: fixed
  found_by: maintainer
  stage: S20
  refs:
  - §19.77
  violates:
  - R-276
  - R-277
  story: >-
    The first fix gave the list three honest answers instead of two: *can work here*, *missing the training*,
    and *outside their area, allowed only with a recorded reason*. You looked again and said the label
    was not the point — the rows should not be there at all.


    **The list now stops at the plant the person belongs to, for every person, not just the one you were
    looking at.** What is trimmed is *counted* underneath — “12 places outside Plant A are not shown”
    — because a list that quietly shrank looks exactly like a person with no options.


    **★ The cut is the plant, not their own area, and that is what keeps the third answer alive.** Lending
    somebody from Line 1 to Line 2 in the same plant is a thing supervisors do and is exactly what the
    override was built for. Cutting at their own line instead would have removed that possibility from
    the screen entirely.


    **★ Operator A1 is the only person in the demo who could have shown you this** — every plant has six
    people, five belonging to the whole plant and one belonging to a single line. For the other five,
    both possible answers look identical. You happened to open the one that distinguishes them.
- id: F-062
  title: I wrote a warning in bold, in the plan, arguing for the wrong answer
  tag: My own reasoning · and you overturned it in one sentence
  status: fixed
  found_by: maintainer
  stage: S20
  refs:
  - §19.77
  story: >-
    When the Operators screen was fixed I wrote, in bold: *“the fix is NOT to hide the other plants”*
    — reasoning that since a supervisor may place someone outside their area with a reason, hiding those
    places would delete the feature. **You read the result and said the opposite: “those locations should
    not be visible at all is my point.”


    You were right, and the reason is worth keeping.** I had reasoned by analogy with the scheduling board,
    where the picker is anchored on a specific cell and *must* list every candidate — because listing
    them is how you place one. The admin screen places nothing. **The same rule can be correct on one
    screen and wrong on the next**, and an argument that travels between them without being re-checked
    is how a plan starts contradicting the product.


    **★★ The standing lesson: a bold warning in my own plan is a previous sitting’s argument, not evidence.**
    I had inherited that line from the earlier note and treated it as settled. It is now recorded as a
    wrong argument rather than quietly deleted, because the reasoning error is the useful part.
- id: F-063
  title: A screen test that had been passing through the wrong half of the code for its entire life
  tag: My instruments · the test was the thing that was broken
  status: fixed
  found_by: test
  refs:
  - §19.79
  story: >-
    **The Products screen is the only one with a test that actually draws it, and it has been green from
    the day it was written.** It was green for the wrong reason. The stand-in it uses for the database
    read was missing one flag — the one that says “the structure list arrived”. Without it, **every single
    case ran the “the structure list failed to load” branch**: no plant names, every row labelled “Another
    site”, and the count line it was supposed to be checking unreachable.


    **So eight checks named after behaviour they never once exercised.** They did not fail; they quietly
    tested a different screen.


    **★★ The lesson is the sharpest one this project has about fakes: a stand-in that omits a field does
    not error, it silently picks a branch** — and the suite then reports coverage it does not have. It
    is the same family as the run that once reported every deliberate breakage as uncaught: the number
    looked like a result and was a broken instrument. Fixed, the fixture rebuilt so cases stop editing
    each other’s data, and nine new checks added on top.
  stage: S25
- id: F-064
  title: A dropdown showing one thing and saving another — three times, in three different screens
  tag: Three screens · one shape
  status: fixed
  found_by: agent
  refs:
  - §19.79
  violates:
  - R-286
  story: >-
    **This is a browser behaviour worth knowing on sight, because nothing on screen looks wrong when it
    happens.** Give a dropdown a stored value that is not one of the options it is currently offering,
    and it displays *the first option* and reports nothing at all. The box says one thing; the save sends
    another.


    The plant filter was only the reason to look. All three were already there:


    **Products.** Re-home a part to Plant 2, then filter to Plant 1: the owner box reads “Plant 1” and
    Save sends Plant 2.


    **Shift patterns.** The “which pattern runs here” draft is stored per place but holds a *pattern*;
    with the pattern list narrowed, a row reads “Inherit from above” and Apply sends the pattern you can
    no longer see.


    **Operators.** On a cold load the “belongs to” box showed the first plant while the form held nothing,
    so Add submitted an empty owner. **★ And the note beside it claimed a guard that did not exist** —
    a comment describing a check nobody had written. It exists now.


    **The general rule:** whenever a list a dropdown draws from can shrink, the held value has to be re-checked
    against it on every render. Three screens already had that check; three did not.
  stage: S25
- id: F-065
  title: The Hierarchy tab ended up with two dropdowns listing the same plants
  tag: Stage 21 · you found it the moment it shipped
  status: fixed
  found_by: maintainer
  stage: S21
  refs:
  - §19.79
  violates:
  - R-280
  - R-283
  story: >-
    **Your words: “the Hierarchy tab still has 2 filters, what are we doing about it?”** And it was worse
    than a duplicate, because the two lists literally read the same. When a new plant is created the app
    *copies* its structure — so that renaming a rung in Plant A does not rename it in B and C — and **the
    copy is named after the plant**. So the Site Structure chooser was offering “Plant A / Plant B / Plant
    C” directly underneath a header reading “Showing: Plant A”. In practice a structure *is* a plant,
    and that chooser was a plant chooser wearing another name.


    **It was my inconsistency, not a new question.** The new filter narrows every other list and every
    other dropdown on every other tab; I simply missed this one. It now narrows too, and the selection
    is resolved against what the chooser actually offers — a choice must not outlive the list it was made
    from.


    **★ One structure is deliberately kept at every plant:** the unowned original, which is the seed corn
    every new plant is copied from. Hiding it under a filter would leave you unable to build a new plant
    while looking at an old one.


    **★ And I checked which one it lands on rather than assuming.** Narrowed to Plant A the list is “Plant
    A” and “Standard Plant”, sorted by name, so it opens on your plant’s own structure. Had it sorted
    the other way you would have been quietly editing the rungs of an empty structure.
- id: F-066
  title: >-
    I filed a bug that wasn’t one, because I believed a comment instead of reading the code it described
  tag: My own process · I reported this one to you twice before checking it
  status: fixed
  found_by: agent
  refs:
  - §19.79
  story: >-
    **I told you twice that the “belongs to” dropdowns on three screens were offering places the database
    would refuse to save to, and that fixing it was the obvious next job.** It was not a bug. I had read
    the note attached to the shared helper — which says, persuasively, that a dropdown offering something
    the server will reject is a control whose only outcome is an error message — and filed it without
    opening the three screens that use it.


    **One of them had already tried it, measured the result, and undone it**, with the reason written
    down at the spot: the only list the app can build of “places you administer” is derived from which
    *structures* you own, which is not the question the save actually asks — so a plant admin whose plant
    had no structure of its own was offered **nothing at all**. Its verdict: offering something the server
    then refuses costs one clear sentence; offering nothing costs the whole feature.


    **And there is no right answer available to build.** The server can tell the app which *structures*
    you may edit, and whether you administer *anything* — but nothing that lists the places. So there
    was never a correct list to narrow to.


    **★★ What was actually wrong was the note, and the unused switch it was attached to.** Nobody had
    ever used that switch; it sat there with a convincing explanation of why someone should. **A dead
    option with a persuasive comment is not harmless — it argues for itself, and it argued me into two
    false reports.** Both are gone, the reasoning is kept where they were, and the check that tested the
    switch now pins the rule that replaced it.


    Worth saying plainly: this is the same mistake as the bold warning above, made in the other direction
    — last time I believed my own plan over the product, this time a comment over the code beside it.
  stage: S25
- id: F-067
  title: Every training in the demo was named after its plant, and the comment said why
  tag: The demo data had been telling us for weeks
  status: fixed
  found_by: agent
  stage: S21
  refs:
  - §19.80
  - D111a
  violates:
  - R-D111a
  story: >-
    Training names had to be unique across the whole company, while a training belongs to one plant and
    you can only see your own. So the second plant to want a “Forklift” was refused — pointed at a row
    it had no way to open, edit or reuse.


    **★★ The sample data had been working around this since the day it was written**, calling everything
    `A-Welding`, `B-Welding`, `C-Welding`, with a comment saying *“names are unique per org, so they carry
    the plant letter”*. **A fixture prefixing its way around a product rule is the loudest signal there
    is, and it sat in the repository unread for weeks.


    ★ You proposed the same workaround independently** — put the plant in the name — which is what told
    me it was the natural reading. We did the other half instead: the plant is already stored in its own
    column, so it is shown rather than typed in, and it follows a rename for free. **Dropping those prefixes
    from the demo is the proof it works**, and three lookups in that file had to learn the owner, because
    a name on its own had stopped being enough to identify anything.
- id: F-068
  title: A stricter safety net and a hand-written list of columns, disagreeing in silence
  tag: I shipped it, an agent caught it
  status: fixed
  found_by: agent
  stage: S22
  refs:
  - D114
  story: >-
    Adding the on/off flag to trainings meant asking the database for one more column and teaching the
    safety net to insist on it. **There were two copies of that column list** — a named one and an older
    hand-written one three hundred lines up — **and I only updated the named one.** The other kept asking
    for the old columns, so the net rejected every training that came back. **Both screens would have
    rendered completely empty.


    ★★ All 1,276 checks were green while that was true**, because the screen tests hand the safety net
    rows they invented rather than rows the database read actually asked for. Nothing else could see it:
    one side is a string, the other is hand-written code.


    **It is last week’s lesson with the arrow reversed.** Then, a database change made a column optional
    and broke a hand-written check. This time a stricter check broke a hand-written column list. **Either
    half can move, and the failure is always silent — it looks like “there is no data”, never like an
    error.** The new check builds its test data *from the column list itself*, so the two cannot drift
    apart again.
- id: F-069
  title: The plant chooser blinked on every tab change — and the chooser was not the problem
  tag: Found by driving the real app
  status: fixed
  found_by: maintainer
  refs: []
  violates:
  - R-047
  story: >-
    **You spotted this and guessed it was the filter’s placeholder.** Right about where, one layer off
    about why. I drove the running app in a real browser and sampled every frame: the chooser’s row **vanished
    and came back within one or two frames on every single tab switch**, and everything below it jumped
    up and dropped back down.


    **What was actually happening: switching tabs was throwing away the whole data cache.** The code that
    answers “who is signed in” kept its record of the current person *per component*, starting from “nobody”.
    Six components ask that question now — so every freshly opened panel compared “nobody” against you,
    concluded somebody had just signed in, and cleared everything. The chooser needs the site list to
    know how many plants you have; for a moment there was no list, so the row removed itself.


    **★ It only showed for you, and that is why it looked like a chooser bug.** Anybody who can see one
    plant has no chooser at all — so for them there was nothing to blink, and the cache was being thrown
    away silently and paid for in extra loading.


    **★★ Measured before and after rather than argued:** seven frames out of 235 with no row, against
    **zero out of 236**. The clearing itself is right and stays — a real sign-in must drop the last person’s
    data. What was wrong is who gets to say an identity changed, and *a component opening is not that*.
- id: F-070
  title: I built the plumbing under a screen and never built the screen
  tag: My own sequencing · you had to ask twice
  status: fixed
  found_by: maintainer
  stage: S22
  refs:
  - D104
  story: >-
    **Your words: “I thought we were going to create a trainings tab like operator/shifts/products. These
    should be editable and we’re still calling them tickets.”** You were right, and nothing you said had
    been unclear.


    The plan had the tab queued as stage 22, *behind* stage 21. I worked the list in the order it was
    written and never checked the order was still yours. **Two things made that worse, and both are mine.**
    I had been saying “trainings” back to you for a dozen messages while the screen still said “Tickets”
    — which on its own reads as if the rename were done. And when you said *“trainings can be added by
    individual site admins, but only to their own sites”*, I heard a question about permissions and answered
    with a database rule. **It reads just as naturally as a statement about a screen you expected to exist**
    — because “a site admin adds a training” meant, that day: open Operators, pick some person, expand
    a toggle.


    The database work was not wasted — two plants genuinely could not both have a “Forklift”, and the
    starter set was dead without fixing it. **But you asked for the screen and I delivered the pipework
    under it.** The standing correction: **a queue’s order is a guess about priority, not a fact, and
    it is cheap to ask.**
- id: F-071
  title: Half the sign-off was already in the database, with a note saying nothing reads it
  tag: Two columns in two weeks that existed and did nothing
  status: fixed
  found_by: agent
  stage: S22
  refs:
  - D114
  story: >-
    Stage 22 needed two facts about a training somebody holds: *when it was done* and *who signed it off*.
    **The first one had been sitting in the database for months**, with a comment beside it reading, accurately,
    *“nothing in this app reads it”*. So the change added one field, not two.


    **★ That is the second time in two weeks.** The on/off switch for trainings shipped the same way last
    week — a real column with no screen behind it, which is why “retire instead of deleting” was unavailable
    until the Trainings tab was built. **Two is a pattern, not a coincidence: it is worth going looking
    for the others rather than finding them one at a time when a feature happens to need them.**


    Worth saying because it cuts the other way too: the honest reason both existed was that somebody added
    the column while building the thing next to it and left the screen for later. That is not wrong —
    it is how the delete warning could offer “deactivate instead” the moment a screen existed. It just
    needs writing down somewhere that gets read.


    **★★ So I went and counted, instead of leaving it as a worry.** Every column in the database, checked
    against every line of the app: **94 columns, and exactly two that the app never mentions** — both
    on the audit trail, which is written and never read back by design. **There is no third one waiting.**
    The pattern was two, both are now on screen, and it is closed rather than open. That took one command
    and replaces a standing suspicion with a number.
- id: F-072
  title: Supervisors needed no new permission — the one that decides scheduling already said it
  tag: A rule you set, that the database already had
  status: fixed
  found_by: agent
  stage: S22
  refs:
  - D114
  violates:
  - R-239
  story: >-
    You asked for supervisors to keep the training record, and then narrowed it yourself: *“the supervisor
    is assigned to a line, so can give them control only for the line they’re assigned to?”*


    **★★ That rule already existed, and it is the same one that decides who may put work on a cell.**
    An assignment covers the place it names and everything under it, never anything above — so “assigned
    to a line” already meant that line and its cells. Nothing new had to be invented, which matters more
    than it sounds: a second, parallel idea of “may I act here” is two rules to keep in step, and they
    drift.


    **★ Two checks are what make it real, and either alone proves nothing.** Somebody with the supervisor
    title but no assignment is refused; somebody with the assignment but only view rights is refused.
    **Delete half the rule and one of those two still passes** — which is exactly how a permission check
    quietly stops checking.


    **⚠ And it created a new problem, which is now also fixed.** A line supervisor can *see* the plant’s
    trainings and cannot change them — so the screen was offering Rename and Retire on rows the database
    would refuse. The same “screen says yes, database says no” defect you found on the Operators screen,
    arriving from the other direction the moment supervisors were let in.
- id: F-073
  title: Switching tabs was quietly throwing away everything the app had loaded
  tag: You spotted a flicker · it was the cache
  status: fixed
  found_by: maintainer
  refs: []
  violates:
  - R-047
  story: >-
    **You noticed the plant chooser blink for a fraction of a second when moving between tabs, and guessed
    it was the chooser.** Right about where, one layer off about why — and the real answer was doing a
    lot more damage than a blink.


    **Switching tabs was clearing the entire data cache.** The code that answers “who is signed in” kept
    its record of the current person *separately in each part of the screen*, each starting from “nobody”.
    Six parts ask that question now — so every freshly opened tab compared “nobody” against you, concluded
    somebody had just signed in, and threw everything away. The chooser needs the list of places to know
    how many plants you have; for one frame there was no list, so it removed itself.


    **★ It only showed for you.** Anybody who can see one plant has no chooser at all, so there was nothing
    to blink — and their cache was being discarded silently and paid for in extra loading nobody could
    see.


    **★★ Measured rather than argued, before and after:** the app was driven in a real browser and sampled
    every frame. Seven frames out of 235 had no chooser; afterwards, **zero out of 236**. The clearing
    itself is right and stays — signing in as somebody else must drop the last person’s data. What was
    wrong is *who gets to say the person changed*, and a part of the screen opening is not that.
- id: F-074
  title: A list of columns written out twice, and the second copy empties a screen in silence
  tag: The same mistake twice in one day, in one file
  status: fixed
  found_by: agent
  stage: S22
  refs:
  - D114
  story: >-
    **This happened, was fixed, and then very nearly happened again four hours later in the same file.**
    Asking the database for a training means naming the columns you want; checking what comes back means
    naming them again. When a column was added, the named list was updated and **a second, older copy
    of the same list three hundred lines away was not**. The check then rejected every row that came back,
    because it was missing a column nobody had asked for.


    **★★ The screen renders completely empty, and nothing anywhere reports an error.** All 1,276 checks
    were passing while it was true. They could not see it: the screen tests hand the checker rows they
    made up themselves, rather than rows the database read actually requested. One side of the mismatch
    is a piece of text, the other is hand-written code, and nothing compares them.


    **It is last week’s lesson with the arrow reversed.** Then a database change made a column optional
    and broke a hand-written check; this time a stricter check broke a hand-written list. **Either half
    can move, and the failure always looks like “there is no data” rather than like something breaking.


    ★ The second occurrence was caught by looking, not by testing.** Having fixed it once I searched for
    the pattern, and there it was on the next table down — about to do the same thing to every training
    a person holds. **A column list that appears twice is a bug with a delay on it.** The new check builds
    its test data *from* the list itself, so the two cannot drift apart again.
- id: F-075
  title: Everyone but the system admin had no hierarchy filters on the matrix
  tag: Found by driving it as the real roles
  status: fixed
  found_by: maintainer
  stage: M5
  refs:
  - §19.86
  violates:
  - R-305
  story: >-
    **The maintainer reported it in the middle of building M5:** *"site admins and supervisors have no
    hierarchy level filters in the matrix tab, only the system admin has them."* Exactly right, and the
    cause was a quiet one.


    The matrix's area/line filters were anchored on the plant chooser's value. But that chooser only
    appears for a reader who can see **more than one plant** — a company/system admin. Anyone with a
    single readable plant (every site admin, every supervisor) has the chooser hidden, and the shared
    plant-filter code correctly resolves their choice to null. Anchoring the cascade on that null meant
    they got no area or line filter at all — the very readers a supervisor view is for.


    **The fix is to stop asking "what plant did they pick" and ask "what is the top of what they can
    see".** A new `readableRootIds` finds the nodes with no readable parent — which is a supervisor's own
    area just as much as an admin's whole plant — and `cascadeBaseId` hangs the cascade off the sole such
    root when there is no explicit choice. The multi-plant admin at "All plants" is deliberately left
    with no cascade until they pick a plant, because "Area 1" in three different plants is ambiguous.
    Proven both ways: pure tests on the two functions, and driving the screen as a site admin and a
    supervisor, who now each see a filter labelled with their hierarchy's own level word.
- id: F-076
  title: '"Edit" opened half of what it named, on two tabs'
  tag: The label named more than the button did
  status: fixed
  found_by: maintainer
  stage: S22
  refs:
  - D106
  - D115
  violates:
  - R-306
  - R-307
  story: >-
    **The maintainer, 2 Sept:** on Shifts, *"the edit button on the shift doesn't actually open the whole
    tab, it only opens to rename it, is very misleading"*; on Products, *"hitting edit does not open the
    option to change colours. Feels wrong and non-intuitive."* Right on both.


    Two earlier decisions had each scoped "Edit" deliberately narrow and moved the rest elsewhere: D106
    made the pattern's Edit a name-and-owner control, with the shifts behind a separate click on the
    pattern name; D115 made the product's Edit code-and-name, with the colour on a clickable swatch. Each
    was defensible in isolation, and together they taught the reader that "Edit" meant "edit some of it"
    — and left the most-wanted thing (the shift times, the colour) down a path they had to already know
    about.


    **The fix follows the label, not the old scoping.** A pattern's Edit now also expands the pattern, so
    name, owner, shifts and breaks all open at once; a product's Edit now shows the colour palette inside
    the edit panel, the swatch kept as a shortcut. One existing shift test had opened the pattern with a
    second click that now toggles it shut, so that step is gone — what it defends is unchanged. Both
    driven in the browser as the company admin.
