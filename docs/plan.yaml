  title: Trainings, not tickets — with a sign-off
  status: done
  owner: agent
  refs:
  - D104
  - D114
  - migration 0032
  delivers:
  - R-D104
  what: >-
    **You are right that the word is wrong, and righter that the record is thin.** What exists today is
    a list of trainings and, per person, an expiry date. That is it. So the question an audit actually
    asks — *who signed this person off, and when* — cannot be answered at all.


    **So: the word changes everywhere on screen, and the record grows two fields** — trained on, and signed
    off by a named person — alongside the expiry it already has. And trainings get their own section,
    so a supervisor manages the list and sees who holds what, instead of it living behind a link inside
    Operators.


    **What is left in this stage**

    - **Trainings have their own tab**, beside Operators and Products.

    - **The word changed** — nothing a reader sees says “ticket” any more.

    - **Retire and bring back**, so a training can be withdrawn without stripping it off everyone who
    holds it.

    - **The database side of the sign-off** — who signed it off, and when.

    - **Supervisors are allowed to keep the record**, on their own line or plant and nowhere else.

    - **The sign-off is on the screen** — when it was done and who signed it, editable on every training
    somebody holds.

    - **Supervisors are in**, seeing Operators and Trainings and nothing else.

    - **Controls a supervisor cannot use are not offered** — a row they can see but not change says so,
    instead of showing buttons that get refused.

    - **Nothing — stage 22 is done.** Two small follow-ups turned up on the way and are noted at the top
    of this page rather than left buried in here.
  state: >-
    **Half of it is in, and it is the half you asked about.** Trainings have **their own tab**, beside
    Operators and Products. Before this they were a “Ticket types” toggle INSIDE the Operators screen,
    reachable only after picking somebody — so managing the list meant choosing an arbitrary person first.
    The word changed everywhere a reader can see it; the database keeps its own vocabulary, which is a
