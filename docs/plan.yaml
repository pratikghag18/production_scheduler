    assignment can say how much can be made in the time a person is there — "(how much time a person is
    assigned - breaks) / standard cycle time" — as a DEFAULT the existing target field still overrides. On
    their model for the level above, the sum, this agreed with a distinction: summing cells is right as labour
    content per unit, but it is not a line's output rate (sequential stations are limited by the slowest cell,
