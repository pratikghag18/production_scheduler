  what: >-
    **Your words, and they overturn a decision I made three days ago.** When the shared lists (products,
    people, trainings, shift patterns) got an owning plant, I made ownership decide who may *change* a
    row and deliberately left *reading* open to everyone in the company. I had a reason and I wrote it
    down. **The reason was about how one piece of code works, not about how the business works**, and
    your frame was always about reading: each site is its own instance of the app.


    **The rule, in one line.** You can see a row if it is marked company-wide, or if the plant that owns
    it and a place you have been given are on the same branch — either direction. A supervisor on Line
    1 sees Plant 1’s products, because Line 1 is inside Plant 1. Plant 2 does not, because those two branches
    never meet. Company administrators still see everything. **Company-wide rows stay visible to everyone**,
    which is what “we can have defaults” meant.


    **Why it is not a one-line change, and this is the honest part.** Three things have to move in order.
    **First**, the check that decides whether a person is qualified for a job currently looks up their
    trainings *as that person* — so the moment they cannot see a training, they silently stop being qualified
    for it and the app refuses to assign them, with no error explaining why. That has to be fixed before
    anything is hidden, not after. **Second**, the board has to keep showing products that already appear
    on the schedule even if they belong elsewhere, or your history fills up with “unknown product” in
    a single colour. **Third** — and I only found this while looking — **the board was hardcoded to show
    Plant 1 to everybody**. Signing in as Plant 2 asked the server for Plant 1’s schedule; you saw almost
    nothing because the runs themselves were already protected, but the main screen of the app was pointed
    at the wrong plant for anyone outside Plant 1. **That was a worse bug than the one you reported, and
    it is fixed below.**


    **One more thing that was supposed to exist and does not.** When we agreed that “belongs to” would
    decide *where something is offered* — a product on Line 1 appearing on Line 1’s cells and nowhere
    else — I built the picker and the rule, wrote tests for the rule, and never connected it to the board.
    It has been sitting there unused. It gets connected here.


    **Built and checked, the database half.** Signed in as Quinn on a real database, before: four products
    (one of them Plant 1’s), nine people, two shift patterns. After: only her own and the company-wide
    ones. Exactly two things in the suite broke and both were alarms I had set for this change. There
    is a new test file of eighteen checks, and I broke the change eleven different ways on purpose to
    confirm they catch it — ten caught, and the eleventh was a harmless edit that correctly caught nothing.


    **★ It also found something worse.** The check that decides whether someone is qualified was reading
    their trainings as that person, so a requirement set on a whole plant was invisible to a supervisor
    with one department. Same cell, same person: an administrator was told “not qualified” and a supervisor
    was told “qualified”. Fixed by the same change.


    **And the board half, which was the visible part.** It now asks for the place YOU can see, names it
    in the header, and offers a chooser when you can see more than one. **The obvious version would have
    given every supervisor an empty board** — asking “which plants can you see” returns nothing for someone
    whose access is one department. Measured before writing it, then written the other way round: the
    highest thing you can see, whatever level that is.


    **★ You reopened this, and you were right.** Your words: *“plant 1 admin can see products from other
    site, while plant 2 admin can only see their own and company-wide ones.”* Same code, two different
    answers — so it was never about who you are, and I went and reproduced it on the real database before
    touching anything.


    **What was actually happening.** The rule I built has a second door in it, on purpose: **a product
    stays readable if it is already sitting on a run you can see.** That door exists so your schedule
    history doesn’t fill up with grey “unknown product” blocks. But the products *list* was walking through
    the same door. Dana administers Plant 1; a Plant 2 product happened to be scheduled on one of Plant
    1’s cells, so it appeared in her catalogue. Quinn saw nothing extra only because no Plant 1 product
    happened to be scheduled inside Plant 2. **The difference between the two of them was luck about what
    was on the board**, not anything about their access — which is exactly why one looked correct and
    the other did not.


    **Fixed for products.** The catalogue now lists only what you own or what is company-wide, full stop,
    and where a foreign-owned product is on your schedule it says so in one line rather than hiding it
    silently: *“1 product scheduled here belongs to another site, so it isn’t listed.”* Six new checks,
    five deliberate breakages, four caught and one measured harmless. I rendered the screen and looked
    at it: the Plant 2 product is gone and the line is there.


    **Not yet fixed for people and shift patterns, and that is why this stage is open again.** Operators
    go through the same second door, and there it is worse — an operator from another plant assigned to
    one of your cells shows up in your people list **with no indication at all**. Shift patterns have
    the same shape. Both got the same treatment — but not the one planned here; read on.


    **★★ And then you changed the model instead of the code, which was the right call.** Your words: *“remove
    company-wide as an option for products and operators. Each site has its own set… no product or operator
    can be assigned where it does not belong.”* Here is why that is a better fix than the one I was about
    to make. The leak existed because a Plant 2 product could be *scheduled* on a Plant 1 cell, and I
    had to keep those readable so your history didn’t fill with grey blocks. **If a product can only ever
    be scheduled inside the site that owns it, that situation cannot arise at all.** So the exception
    got deleted rather than patched a third time — and the same door closed for people and shift patterns
    at the same moment, instead of needing two more fixes and one more for every screen built after them.


    **What is built and checked.** Every product, person, training and shift pattern now belongs to something
    — and to any level, so a product can belong to Line 1 and be offered on Line 1 and nowhere else. The
    rule is one sentence with no “except”: **you see a row if the place that owns it and a place you have
    been given are on the same branch.** Three more things turned up while doing it: **an owner could
    be moved out from under its own history** (re-home a product to another plant and every run it already
    had became a foreign row on your board — the same bug through a door no insert guards); **two tables
    were still readable company-wide** and nobody had looked, so a Plant 2 supervisor could list which
    trainings Plant 1’s cells require; and **a person could hold another plant’s training.** All three
    closed.


    **★ And the database change shipped with a real bug that only one kind of test could see.** The step
    that gives existing rows an owner used a Postgres function that does not exist. It never runs on a
    fresh database — there is nothing to convert — so all 403 checks passed and it would have failed on
    the first real customer. The upgrade test caught it on its first run. That test exists because of
    a rule written down three weeks ago; this is the day it paid for itself.


    **★ And the data is new too, which is what you were asking about.** The old Plant 1 with Maria and
    Widget X is the *test fixture* — about eighteen checks rest on that plant being the only one, so it
    stays exactly as it is and the app stopped using it. **What the app shows now is Plant A, Plant B
    and Plant C**, each with two areas, three lines and six cells, its own part numbers, its own people,
    its own trainings and its own shift pattern. **And deliberately not everything belongs to a whole
    plant** — each site has one part that belongs to a single line and one to a single area, because a
    world where everything belongs to a plant cannot show you the rule working at all.


    **★★ Sign in as Ana.** She is a supervisor with access to *one line*, and she is the one person in
    the cast who can show you both halves of the rule at once: she sees the two parts that belong to the
    whole of Plant A, because they sit *above* her; she sees the part that belongs to her own line; and
    she does **not** see the one that belongs to Area 2, because that branch and hers never meet. Her
    board opens on her line rather than on the plant. Measured on a real database, not predicted.


    **★★ The delete warning is built, and the rule is yours in one line:** *“the row disappears from the
    list and from anything not yet started; completed runs keep their record of it.”* So deleting a part
    removes the jobs booked for next week along with the people rostered on them, and leaves last month’s
    jobs on the board still saying which part they made — the code, the name and the colour are copied
    onto them at the moment the part goes. Same for a person: their finished shifts keep their name on
    them.


    **★ “Not yet started” is decided by the CLOCK, and that mattered more than it sounds.** Every job
    in the system carries a status field, and the obvious reading is “delete the ones marked planned”.
    **Nothing in the app has ever moved that field** — every job ever created is still marked planned,
    including the ones that finished last month — so that version would have deleted the history instead
    of keeping it. It goes by the start time instead. And a job with no start time at all is *kept*: a
    row whose start we cannot name is not one to delete.


    **The dialog asks the server before it asks you.** It names real counts — “1 job on the schedule,
    2 shifts for people” — and both dangerous buttons stay dead until that answer arrives, because a confirmation
    you can click through before it knows what it is confirming is worse than none, since it looks like
    one. **The confirm button carries the count in its own label** rather than saying “Delete for good?”,
    which is the same rule as the button that said “Rename” and did three things.


    **★ “Deactivate instead” is only pushed when something is actually at risk**, and that is a decision
    rather than a detail. Deleting a part nobody has ever scheduled destroys nothing, and a warning that
    fires when there is nothing to warn about is one people learn to click past — after which the one
    that matters gets clicked past too. Three levels, not two: nothing at stake, only finished work at
    stake, or work not yet started at stake. Only the third pushes you towards deactivating.


    **★ Deleting a training now takes it off everyone who holds it — and that is what makes it possible
    at all.** A training can belong to one line while a plant-wide person legitimately holds it, and the
    admin who owns that line has no rights over that person’s record. Without the change, “delete this
    training” would be a dead end nobody in the company could finish. The dialog counts the people first.


    **★★ And the whole delete runs as YOU, with no elevated privileges — which is the rule you set last
    time paying for itself.** Deleting a part reaches jobs on cells you never named. A week ago that would
    have needed the operation to run as somebody bigger than you, with its own permission story to get
    wrong. Because nothing can now be scheduled outside the place that owns it, anything the delete can
    reach is already inside your own authority — there is a written proof of that in the change itself,
    and a check that stops the operation dead if it ever stops being true.


    **Two things the app was saying that had quietly become false.** A refusal message still offered *“company-wide
    products can only be changed by a company admin”* — a day after company-wide products stopped existing.
    It compiled, and it had a passing test that checked for that exact wrong sentence. And a rule on the
    People screen refused to delete anyone still holding a training, telling you to *“remove them first”*
    — work that, after this change, no longer needs doing. **A stale permission check fails loudly the
    first time somebody tries it; a stale refusal never fails at all — it just quietly stops people doing
    something they are allowed to do.** Both deleted rather than reworded.


    **One thing deliberately left half-done, and named so it is not a surprise.** Trainings and shift
    patterns now have an on/off switch in the database, so all four lists mean the same thing — but no
    screen shows or sets it yet, so the dialog offers no “deactivate instead” for those two. Building
    the switch without the screen would be the “add form, no edit form” mistake again; it is written down
    as owed instead.


    **What is left in this stage**

    - **Read scoping** — one plant can no longer see another's rows.

    - **Ownership on every shared list**, at any level, not just whole plants.

    - **The board's picker and its crew list** both follow it.

    - **The naming rule that blocked the starter set** — two plants can each have a “Forklift” now.

    - **The starter set — DONE (Sep 1), and it changed shape.** Rather than a curated catalogue every
    plant copies parts out of, a **new plant is created as a copy of an existing plant’s structure** —
    the whole node tree, atomically — and then filled in by import. Your redefinition, and it is the last
    thing stage 21 was holding.
  state: >-
    **In progress.** Two database changes, twenty-eight new checks between them, and seventeen deliberate
    breakages to confirm the checks catch what they claim; a third database change on top of them, with
    eighteen more checks and ten more deliberate breakages — nine caught and the tenth a harmless edit
    that correctly caught nothing. **445 database checks pass here, up from 408**, and the delete change
    was broken sixteen ways on purpose: fifteen caught, one a harmless edit that correctly caught nothing.
    **One of the sixteen came back uncaught on the first run and was a real hole** — taking the permission
    check out of the delete left every check passing, because a second gate underneath refuses it anyway
    and produces the same error code; what it changes is the sentence you would read, from “you may not
    administer this site” to “the product could not be deleted”, which is not something anyone can act
