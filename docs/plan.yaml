- id: 52
  date: 2026-09-04
  title: The assignment status picker is removed (R-322)
  commits:
  - 69dca5e
  numbers:
    app_tests: 1787
    app_test_files: 60
    tsc: 0
    eslint: 0
  confirmed: true
  summary: >-
    The maintainer, on the planned / active / done picker in the assignment pop-up: *"No one is going to use
    the status option to change it to active in practice ... It doesn't serve a purpose plus there is
    nothing making it mandatory for a supervisor to do."* They asked to be convinced otherwise and there was
    no honest case to make. Nothing read the value — no rule, no screen, no report — and nothing obliged
    anyone to set it, so its only possible destiny was to say "planned" about work that finished last week.
    That is worse than an absent field: a reader takes a label for fact. The pop-up's own header had already
    recorded it as a brief-only addition that neither mockup contained, which is the same observation made
    at build time and not acted on.
    ⭐ THE INTERESTING PART IS WHAT COULD NOT BE REMOVED. `cancelled` writes through the same field and is
    not a label at all — it is the soft delete, and the overlap constraint, the capacity guard and
    `boardIndex`'s rule 17 all key on it. Deleting the field outright would have taken Delete with it. So
    the field stays and its TYPE narrowed from `string` to the literal `"cancelled"`, which says what it is
    for and makes a progress label fail to compile rather than reach the database and go stale there.
    The pin is at the seam rather than in the pop-up, because tsc covers only half of this: the type stops a
    status being TYPED into a field edit, and nothing in the type system says the save path stopped SENDING
    one or that Delete still does. Both are asserted. Driven in the browser: the pop-up shows efficiency,
    target and the time band, with Delete still removing the block.
  shipped: []
