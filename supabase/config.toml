# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "production_scheduler"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# WARNING 16, NOT 15. Everything that VALIDATES this schema targets PostgreSQL 16:
# `scripts/verify-db.sh` pins /usr/lib/postgresql/16/bin and its first step is
# "Locate PostgreSQL 16", migration 0004 says its peak query is "validated
# against live PostgreSQL 16", and docs/schema.md says the same. Leaving this
# at 15 meant developers ran a different major version from the one every
# check was run against -- which makes the verification story untrue rather
# than merely inconsistent.
# WARNING Changing it needs `supabase stop && supabase start && npm run db:reset`:
# the local volume holds PG15 data files and will not attach to a PG16 server.
major_version = 16

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["https://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[analytics]
enabled = false
